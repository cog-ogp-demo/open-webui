<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Water Submarine Explorer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        canvas { display: block; }
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #00ffcc;
            font-size: 14px;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px rgba(0,255,204,0.3);
            pointer-events: none;
            z-index: 100;
        }
        #hud div { margin-bottom: 6px; }
        #hud .label { opacity: 0.6; font-size: 10px; letter-spacing: 2px; }
        #hud .value { font-size: 16px; font-weight: bold; }
        #zone-name {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffcc;
            font-size: 32px;
            text-shadow: 0 0 30px #00ffcc, 0 0 60px rgba(0,255,204,0.5);
            pointer-events: none;
            z-index: 100;
            opacity: 0;
            transition: opacity 1s ease;
            letter-spacing: 6px;
        }
        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(0, 255, 204, 0.5);
            font-size: 11px;
            text-align: center;
            text-shadow: 0 0 8px #00ffcc;
            pointer-events: none;
            z-index: 100;
            letter-spacing: 1px;
        }
        #creature-info {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff88ff;
            font-size: 14px;
            text-shadow: 0 0 15px #ff88ff, 0 0 30px rgba(255,136,255,0.3);
            pointer-events: none;
            z-index: 100;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        #loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at center, #001428 0%, #000408 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 2s ease;
        }
        #loading h1 {
            color: #00ffcc;
            font-size: 36px;
            text-shadow: 0 0 30px #00ffcc, 0 0 60px rgba(0,255,204,0.5);
            margin-bottom: 10px;
            letter-spacing: 4px;
        }
        #loading .subtitle {
            color: #4488aa;
            font-size: 14px;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        .loading-bar {
            width: 300px;
            height: 2px;
            background: #112233;
            border-radius: 2px;
            overflow: hidden;
        }
        .loading-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ffcc, #0088ff, #00ffcc);
            width: 0%;
            animation: load 2.5s ease forwards;
            box-shadow: 0 0 15px #00ffcc;
        }
        @keyframes load { to { width: 100%; } }
        #depth-gauge {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 200px;
            background: rgba(0, 255, 204, 0.08);
            border-radius: 2px;
            z-index: 100;
            pointer-events: none;
        }
        #depth-gauge::before {
            content: '';
            position: absolute;
            top: -20px;
            left: -8px;
            width: 20px;
            text-align: center;
            font-size: 8px;
            color: rgba(0,255,204,0.4);
        }
        #depth-gauge-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(to top, #ff3366, #ff8800, #00ffcc);
            border-radius: 2px;
            transition: height 0.5s ease;
            box-shadow: 0 0 8px #00ffcc;
        }
        #depth-marker {
            position: fixed;
            right: 30px;
            font-size: 10px;
            color: rgba(0,255,204,0.6);
            pointer-events: none;
            z-index: 100;
            transition: top 0.5s ease;
        }
        .vignette {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 50;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
        }
        .scan-line {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 51;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.03) 2px,
                rgba(0,0,0,0.03) 4px
            );
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>DEEP WATER EXPLORER</h1>
        <div class="subtitle">SUBMARINE SYSTEMS INITIALIZING</div>
        <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    </div>

    <div class="vignette"></div>
    <div class="scan-line"></div>

    <div id="hud">
        <div class="label">DEPTH</div>
        <div class="value" id="depth-val">0 m</div>
        <div class="label">VELOCITY</div>
        <div class="value" id="speed-val">0.0 kn</div>
        <div class="label">BEARING</div>
        <div class="value" id="heading-val">000°</div>
        <div class="label">ZONE</div>
        <div class="value" id="zone-val">Sunlight Zone</div>
        <div class="label">SPECIES LOGGED</div>
        <div class="value" id="creatures-val">0 / 12</div>
    </div>

    <div id="depth-gauge">
        <div id="depth-gauge-fill" style="height: 5%"></div>
    </div>
    <div id="depth-marker">0m</div>

    <div id="zone-name"></div>
    <div id="creature-info"></div>

    <div id="controls">
        [ W ] FWD &nbsp;&nbsp; [ S ] REV &nbsp;&nbsp; [ A/D ] YAW &nbsp;&nbsp; [ Q/E ] DEPTH &nbsp;&nbsp; [ SHIFT ] BOOST &nbsp;&nbsp; [ MOUSE ] LOOK &nbsp;&nbsp; [ F ] FLOODLIGHT
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

        // Custom underwater shader
        const UnderwaterShader = {
            uniforms: {
                tDiffuse: { value: null },
                time: { value: 0 },
                depth: { value: 0 },
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float time;
                uniform float depth;
                varying vec2 vUv;

                void main() {
                    // Subtle caustic distortion
                    vec2 uv = vUv;
                    float distortion = sin(uv.x * 10.0 + time * 0.5) * cos(uv.y * 8.0 + time * 0.3) * 0.002 * (1.0 - depth * 0.8);
                    uv += distortion;

                    vec4 color = texture2D(tDiffuse, uv);

                    // Deep blue color grading based on depth
                    float depthTint = depth;
                    color.r *= max(0.3, 1.0 - depthTint * 0.7);
                    color.g *= max(0.4, 1.0 - depthTint * 0.3);
                    color.b *= max(0.6, 1.0 + depthTint * 0.2);

                    // Slight chromatic aberration
                    float ca = 0.001 + depth * 0.001;
                    color.r = texture2D(tDiffuse, uv + vec2(ca, 0.0)).r * max(0.3, 1.0 - depthTint * 0.7);
                    color.b = texture2D(tDiffuse, uv - vec2(ca, 0.0)).b * max(0.6, 1.0 + depthTint * 0.2);

                    // Vignette
                    float vig = 1.0 - length(vUv - 0.5) * 0.8;
                    color.rgb *= vig;

                    gl_FragColor = color;
                }
            `
        };

        // Audio system
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx, masterGain;

        function initAudio() {
            audioCtx = new AudioCtx();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.3;
            masterGain.connect(audioCtx.destination);

            // Deep ambient drone
            createDrone(55, 0.08);
            createDrone(82.5, 0.04);
            createDrone(110, 0.02);

            // Whale-like sounds
            setInterval(() => {
                if (Math.random() < 0.3) createWhaleSound();
            }, 8000);

            // Sonar pings
            setInterval(() => {
                createPing();
            }, 6000);
        }

        function createDrone(freq, vol) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.value = vol;
            filter.type = 'lowpass';
            filter.frequency.value = 200;
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);
            osc.start();
        }

        function createWhaleSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(80 + Math.random() * 60, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40 + Math.random() * 30, audioCtx.currentTime + 3);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.03, audioCtx.currentTime + 0.5);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 3);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 3);
        }

        function createPing() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 1200;
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 2);
        }

        // Scene
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x001825, 0.006);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 800);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Post-processing
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.5, 0.3, 0.7
        );
        composer.addPass(bloomPass);

        const underwaterPass = new ShaderPass(UnderwaterShader);
        composer.addPass(underwaterPass);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x0a1a2a, 0.4);
        scene.add(ambientLight);

        // God rays from surface
        const godRays = new THREE.Group();
        for (let i = 0; i < 8; i++) {
            const rayGeom = new THREE.CylinderGeometry(0.5, 8, 150, 6, 1, true);
            const rayMat = new THREE.MeshBasicMaterial({
                color: 0x88ccff,
                transparent: true,
                opacity: 0.015,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending,
            });
            const ray = new THREE.Mesh(rayGeom, rayMat);
            ray.position.set(
                (Math.random() - 0.5) * 100,
                40,
                (Math.random() - 0.5) * 100
            );
            ray.rotation.x = (Math.random() - 0.5) * 0.3;
            ray.rotation.z = (Math.random() - 0.5) * 0.3;
            godRays.add(ray);
        }
        scene.add(godRays);

        // Submarine spotlight (main headlight)
        const subSpotlight = new THREE.SpotLight(0xaaddff, 40, 120, Math.PI / 5, 0.4, 1.2);
        subSpotlight.castShadow = true;
        scene.add(subSpotlight);
        scene.add(subSpotlight.target);

        const subFillLight = new THREE.PointLight(0x4488aa, 5, 25);
        scene.add(subFillLight);

        // Floodlight mode
        let floodlightOn = true;
        const floodlight = new THREE.SpotLight(0xffffff, 0, 200, Math.PI / 3, 0.3, 1);
        scene.add(floodlight);
        scene.add(floodlight.target);

        // === SUBMARINE ===
        const submarine = new THREE.Group();

        // Main hull - sleek design
        const hullGeom = new THREE.CapsuleGeometry(0.9, 5, 20, 32);
        const hullMat = new THREE.MeshPhysicalMaterial({
            color: 0x2a3a4a,
            metalness: 0.9,
            roughness: 0.2,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1,
            envMapIntensity: 0.5,
        });
        const hull = new THREE.Mesh(hullGeom, hullMat);
        hull.rotation.z = Math.PI / 2;
        hull.castShadow = true;
        submarine.add(hull);

        // Reinforcement rings
        for (let i = -2; i <= 2; i++) {
            const ringGeom = new THREE.TorusGeometry(0.95, 0.05, 8, 24);
            const ring = new THREE.Mesh(ringGeom, new THREE.MeshPhysicalMaterial({
                color: 0x556677,
                metalness: 1,
                roughness: 0.3,
            }));
            ring.position.x = i * 1.2;
            ring.rotation.y = Math.PI / 2;
            submarine.add(ring);
        }

        // Conning tower (sail)
        const towerGeom = new THREE.CylinderGeometry(0.35, 0.45, 1.0, 12);
        const tower = new THREE.Mesh(towerGeom, hullMat);
        tower.position.set(-0.5, 1.1, 0);
        submarine.add(tower);

        // Tower top
        const towerTopGeom = new THREE.CylinderGeometry(0.3, 0.35, 0.15, 12);
        const towerTop = new THREE.Mesh(towerTopGeom, new THREE.MeshPhysicalMaterial({
            color: 0x445566,
            metalness: 0.9,
            roughness: 0.4,
        }));
        towerTop.position.set(-0.5, 1.65, 0);
        submarine.add(towerTop);

        // Observation dome (glass)
        const domeGeom = new THREE.SphereGeometry(0.5, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2);
        const domeMat = new THREE.MeshPhysicalMaterial({
            color: 0x44ffdd,
            emissive: 0x003322,
            emissiveIntensity: 0.3,
            transmission: 0.8,
            thickness: 0.3,
            roughness: 0,
            metalness: 0,
            clearcoat: 1,
            ior: 1.5,
        });
        const dome = new THREE.Mesh(domeGeom, domeMat);
        dome.position.set(2.0, 0.6, 0);
        dome.rotation.x = -Math.PI / 6;
        submarine.add(dome);

        // Headlights (pair)
        const headlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
        const hlGeom = new THREE.CylinderGeometry(0.12, 0.15, 0.2, 8);
        for (let z of [-0.5, 0.5]) {
            const hl = new THREE.Mesh(hlGeom, headlightMat);
            hl.position.set(3.0, 0.3, z);
            hl.rotation.z = Math.PI / 2;
            submarine.add(hl);

            // Light cone visual
            const coneGeom = new THREE.ConeGeometry(0.3, 1.5, 8, 1, true);
            const coneMat = new THREE.MeshBasicMaterial({
                color: 0xaaddff,
                transparent: true,
                opacity: 0.05,
                blending: THREE.AdditiveBlending,
                side: THREE.DoubleSide,
            });
            const cone = new THREE.Mesh(coneGeom, coneMat);
            cone.position.set(3.8, 0.3, z);
            cone.rotation.z = -Math.PI / 2;
            submarine.add(cone);
        }

        // Propulsion system
        const propHousing = new THREE.Mesh(
            new THREE.CylinderGeometry(0.5, 0.6, 0.8, 12),
            hullMat
        );
        propHousing.position.set(-3.5, 0, 0);
        propHousing.rotation.z = Math.PI / 2;
        submarine.add(propHousing);

        // Propeller
        const propGroup = new THREE.Group();
        propGroup.position.set(-4.0, 0, 0);
        for (let i = 0; i < 5; i++) {
            const bladeGeom = new THREE.BoxGeometry(0.05, 0.7, 0.2);
            const blade = new THREE.Mesh(bladeGeom, new THREE.MeshPhysicalMaterial({
                color: 0x889999,
                metalness: 1,
                roughness: 0.2,
            }));
            blade.rotation.x = (i / 5) * Math.PI * 2;
            blade.position.y = Math.sin(blade.rotation.x) * 0.3;
            blade.position.z = Math.cos(blade.rotation.x) * 0.3;
            propGroup.add(blade);
        }
        submarine.add(propGroup);

        // Dive planes (front)
        const planeGeom = new THREE.BoxGeometry(0.8, 0.04, 0.5);
        const planeMat = new THREE.MeshPhysicalMaterial({ color: 0x3a4a5a, metalness: 0.9, roughness: 0.3 });
        const divePlaneL = new THREE.Mesh(planeGeom, planeMat);
        divePlaneL.position.set(2.0, 0, 1.1);
        submarine.add(divePlaneL);
        const divePlaneR = divePlaneL.clone();
        divePlaneR.position.z = -1.1;
        submarine.add(divePlaneR);

        // Tail fins
        const tailFinV = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.04, 0.8), planeMat);
        tailFinV.position.set(-3.0, 0, 0);
        submarine.add(tailFinV);
        const tailFinH = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.04), planeMat);
        tailFinH.position.set(-3.0, 0, 0);
        submarine.add(tailFinH);

        // Running lights
        const runLightGeom = new THREE.SphereGeometry(0.06, 8, 8);
        const greenLight = new THREE.Mesh(runLightGeom, new THREE.MeshBasicMaterial({ color: 0x00ff44 }));
        greenLight.position.set(0, 0, 1.0);
        submarine.add(greenLight);
        const redLight = new THREE.Mesh(runLightGeom, new THREE.MeshBasicMaterial({ color: 0xff0044 }));
        redLight.position.set(0, 0, -1.0);
        submarine.add(redLight);

        // Submarine glow
        const subGlow = new THREE.PointLight(0x44ffcc, 1, 8);
        subGlow.position.set(2.0, 0.6, 0);
        submarine.add(subGlow);

        submarine.position.set(0, -15, 0);
        scene.add(submarine);

        // Submarine state
        const subState = {
            velocity: new THREE.Vector3(),
            speed: 0,
            maxSpeed: 0.35,
            boostMaxSpeed: 0.8,
            acceleration: 0.004,
            deceleration: 0.995,
            turnSpeed: 0.012,
            roll: 0,
        };

        // Input
        const keys = {};
        let mouseX = 0, mouseY = 0;
        let isPointerLocked = false;

        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key.toLowerCase() === 'f') {
                floodlightOn = !floodlightOn;
                floodlight.intensity = floodlightOn ? 30 : 0;
            }
        });
        document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
        renderer.domElement.addEventListener('click', () => {
            if (!isPointerLocked) {
                renderer.domElement.requestPointerLock();
                if (!audioCtx) initAudio();
            }
        });
        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = document.pointerLockElement === renderer.domElement;
        });
        document.addEventListener('mousemove', (e) => {
            if (isPointerLocked) {
                mouseX += e.movementX * 0.0015;
                mouseY += e.movementY * 0.0008;
                mouseY = Math.max(-0.6, Math.min(0.6, mouseY));
            }
        });

        // === OCEAN ENVIRONMENT ===

        // Ocean floor - more dramatic terrain
        const floorGeom = new THREE.PlaneGeometry(600, 600, 150, 150);
        const floorPos = floorGeom.attributes.position.array;
        for (let i = 0; i < floorPos.length; i += 3) {
            const x = floorPos[i], y = floorPos[i + 1];
            floorPos[i + 2] =
                Math.sin(x * 0.02) * 8 +
                Math.cos(y * 0.015) * 6 +
                Math.sin(x * 0.05 + y * 0.03) * 3 +
                (Math.random() - 0.5) * 2;

            // Create some deep trenches
            const trenchDist = Math.abs(x * 0.8 + y * 0.6);
            if (trenchDist < 15) floorPos[i + 2] -= (15 - trenchDist) * 1.5;
        }
        floorGeom.computeVertexNormals();
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0x0a1510,
            roughness: 0.95,
            metalness: 0.05,
        });
        const floor = new THREE.Mesh(floorGeom, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -100;
        floor.receiveShadow = true;
        scene.add(floor);

        // Massive underwater cliff/wall
        const cliffGeom = new THREE.PlaneGeometry(200, 120, 40, 40);
        const cliffPos = cliffGeom.attributes.position.array;
        for (let i = 0; i < cliffPos.length; i += 3) {
            cliffPos[i + 2] += Math.random() * 5 + Math.sin(cliffPos[i] * 0.1) * 3;
        }
        cliffGeom.computeVertexNormals();
        const cliffMat = new THREE.MeshStandardMaterial({ color: 0x1a2015, roughness: 0.95 });
        const cliff = new THREE.Mesh(cliffGeom, cliffMat);
        cliff.position.set(0, -40, -120);
        cliff.receiveShadow = true;
        scene.add(cliff);

        // Rocks (dramatic formations)
        function createRock(size) {
            const geom = new THREE.DodecahedronGeometry(size, 2);
            const pos = geom.attributes.position.array;
            for (let i = 0; i < pos.length; i += 3) {
                const noise = (Math.random() - 0.5) * size * 0.5;
                pos[i] += noise;
                pos[i + 1] += noise * 0.5;
                pos[i + 2] += noise;
            }
            geom.computeVertexNormals();
            return new THREE.Mesh(geom, new THREE.MeshStandardMaterial({
                color: new THREE.Color().setHSL(0.08 + Math.random() * 0.05, 0.1, 0.08 + Math.random() * 0.05),
                roughness: 0.95,
                metalness: 0.05,
            }));
        }

        for (let i = 0; i < 100; i++) {
            const rock = createRock(1 + Math.random() * 8);
            rock.position.set(
                (Math.random() - 0.5) * 400,
                -98 + Math.random() * 10,
                (Math.random() - 0.5) * 400
            );
            rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random());
            rock.castShadow = true;
            scene.add(rock);
        }

        // Coral reef system - vivid and diverse
        function createCoral(type) {
            const group = new THREE.Group();
            const palette = [
                [0xff1a6d, 0xff69b4], [0xff6600, 0xffaa00], [0xaa00ff, 0xdd44ff],
                [0x00ffaa, 0x44ffcc], [0xff0044, 0xff4488], [0x0088ff, 0x44bbff]
            ];
            const colors = palette[Math.floor(Math.random() * palette.length)];

            if (type === 'tree') {
                // Branching coral
                function addBranch(parent, depth, height, thickness) {
                    if (depth <= 0) return;
                    const geom = new THREE.CylinderGeometry(thickness * 0.6, thickness, height, 6);
                    const mat = new THREE.MeshStandardMaterial({
                        color: colors[0],
                        emissive: colors[1],
                        emissiveIntensity: 0.15,
                        roughness: 0.7,
                    });
                    const branch = new THREE.Mesh(geom, mat);
                    branch.position.y = height / 2;
                    branch.rotation.x = (Math.random() - 0.5) * 0.5;
                    branch.rotation.z = (Math.random() - 0.5) * 0.5;
                    parent.add(branch);

                    const numChildren = Math.floor(Math.random() * 3) + 1;
                    for (let i = 0; i < numChildren; i++) {
                        const childGroup = new THREE.Group();
                        childGroup.position.y = height;
                        childGroup.rotation.x = (Math.random() - 0.5) * 0.8;
                        childGroup.rotation.z = (Math.random() - 0.5) * 0.8;
                        branch.add(childGroup);
                        addBranch(childGroup, depth - 1, height * 0.7, thickness * 0.6);
                    }
                }
                addBranch(group, 4, 1.5, 0.2);
            } else if (type === 'brain') {
                const geom = new THREE.SphereGeometry(1 + Math.random() * 0.5, 16, 12);
                const mat = new THREE.MeshStandardMaterial({
                    color: colors[0],
                    emissive: colors[1],
                    emissiveIntensity: 0.1,
                    roughness: 0.9,
                });
                const sphere = new THREE.Mesh(geom, mat);
                sphere.scale.y = 0.6;
                sphere.position.y = 0.5;
                group.add(sphere);
            } else if (type === 'tube') {
                for (let i = 0; i < 8 + Math.random() * 10; i++) {
                    const h = 1 + Math.random() * 3;
                    const geom = new THREE.CylinderGeometry(0.03, 0.05, h, 6);
                    const mat = new THREE.MeshStandardMaterial({
                        color: colors[0],
                        emissive: colors[1],
                        emissiveIntensity: 0.2,
                    });
                    const tube = new THREE.Mesh(geom, mat);
                    tube.position.set(
                        (Math.random() - 0.5) * 1.5,
                        h / 2,
                        (Math.random() - 0.5) * 1.5
                    );
                    tube.rotation.x = (Math.random() - 0.5) * 0.2;
                    tube.rotation.z = (Math.random() - 0.5) * 0.2;

                    // Tip glow
                    const tipGeom = new THREE.SphereGeometry(0.06, 6, 6);
                    const tipMat = new THREE.MeshBasicMaterial({ color: colors[1] });
                    const tip = new THREE.Mesh(tipGeom, tipMat);
                    tip.position.y = h / 2;
                    tube.add(tip);
                    group.add(tube);
                }
            } else if (type === 'fan') {
                const geom = new THREE.CircleGeometry(1.5 + Math.random() * 1.5, 20);
                const mat = new THREE.MeshStandardMaterial({
                    color: colors[0],
                    emissive: colors[1],
                    emissiveIntensity: 0.08,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.85,
                });
                const fan = new THREE.Mesh(geom, mat);
                fan.position.y = 1.5;
                fan.rotation.x = -0.2 + Math.random() * 0.4;
                group.add(fan);
            }
            return group;
        }

        for (let i = 0; i < 120; i++) {
            const types = ['tree', 'brain', 'tube', 'fan'];
            const coral = createCoral(types[Math.floor(Math.random() * types.length)]);
            coral.position.set(
                (Math.random() - 0.5) * 350,
                -98,
                (Math.random() - 0.5) * 350
            );
            coral.scale.setScalar(0.8 + Math.random() * 2);
            scene.add(coral);
        }

        // === PARTICLES ===

        // Marine snow (many layers)
        function createParticleLayer(count, size, opacity, speed, range) {
            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * range;
                positions[i + 1] = Math.random() * 120 - 100;
                positions[i + 2] = (Math.random() - 0.5) * range;
            }
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({
                color: 0x8899bb,
                size,
                transparent: true,
                opacity,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true,
            });
            const pts = new THREE.Points(geom, mat);
            pts.userData = { speed, range };
            return pts;
        }

        const planktonMat = new THREE.PointsMaterial({

        // === CREATURES ===

        // === JELLYFISH (spectacular bioluminescent) ===
        function createJellyfish(variant) {
            const group = new THREE.Group();
            const isDeep = variant === 'crown';
            const size = isDeep ? 2.5 + Math.random() * 1.5 : 1 + Math.random() * 1.5;
            const hue = isDeep ? 0.75 + Math.random() * 0.15 : 0.45 + Math.random() * 0.15;
            const color = new THREE.Color().setHSL(hue, 1, 0.5);
            const innerColor = new THREE.Color().setHSL(hue, 1, 0.7);

            // Bell (outer)
            const bellGeom = new THREE.SphereGeometry(size, 32, 20, 0, Math.PI * 2, 0, Math.PI * 0.6);
            const bellMat = new THREE.MeshPhysicalMaterial({
                color,
                emissive: color,
                emissiveIntensity: 0.5,
                transmission: 0.7,
                thickness: 0.8,
                roughness: 0.05,
                transparent: true,
                opacity: 0.6,
                side: THREE.DoubleSide,
                ior: 1.3,
            });
            const bell = new THREE.Mesh(bellGeom, bellMat);
            bell.rotation.x = Math.PI;
            group.add(bell);

            // Inner organs/gonads (glowing)
            const innerGeom = new THREE.TorusGeometry(size * 0.4, size * 0.1, 8, 16);
            const innerMat = new THREE.MeshBasicMaterial({
                color: innerColor,
                transparent: true,
                opacity: 0.8,
            });
            const inner = new THREE.Mesh(innerGeom, innerMat);
            inner.position.y = size * 0.2;
            inner.rotation.x = Math.PI / 2;
            group.add(inner);

            // Oral arms
            const armCount = 4;
            for (let i = 0; i < armCount; i++) {
                const armGeom = new THREE.CylinderGeometry(0.08 * size, 0.03 * size, size * 2, 6);
                const armMat = new THREE.MeshBasicMaterial({
                    color: innerColor,
                    transparent: true,
                    opacity: 0.5,
                });
                const arm = new THREE.Mesh(armGeom, armMat);
                const angle = (i / armCount) * Math.PI * 2;
                arm.position.set(
                    Math.cos(angle) * size * 0.3,
                    size * 1.2,
                    Math.sin(angle) * size * 0.3
                );
                arm.userData = { phase: Math.random() * Math.PI * 2, baseAngle: angle };
                group.add(arm);
            }

            // Tentacles (many thin trailing ones)
            const tentCount = 16 + Math.floor(Math.random() * 16);
            for (let i = 0; i < tentCount; i++) {
                const tentLen = size * (2 + Math.random() * 4);
                const tentGeom = new THREE.CylinderGeometry(0.015 * size, 0.005 * size, tentLen, 4);
                const tentMat = new THREE.MeshBasicMaterial({
                    color,
                    transparent: true,
                    opacity: 0.3,
                });
                const tent = new THREE.Mesh(tentGeom, tentMat);
                const angle = (i / tentCount) * Math.PI * 2;
                const radius = size * (0.6 + Math.random() * 0.3);
                tent.position.set(
                    Math.cos(angle) * radius,
                    size * 0.5 + tentLen / 2,
                    Math.sin(angle) * radius
                );
                tent.userData = { phase: Math.random() * Math.PI * 2, len: tentLen };
                group.add(tent);
            }

            // Bioluminescent glow
            const glow = new THREE.PointLight(color, isDeep ? 8 : 3, isDeep ? 25 : 15);
            glow.position.y = -size * 0.3;
            group.add(glow);

            group.userData = {
                type: isDeep ? 'crown_jelly' : 'jellyfish',
                speed: 0.15 + Math.random() * 0.25,
                bobPhase: Math.random() * Math.PI * 2,
                size,
                glow,
            };
            return group;
        }

        // === ANGLERFISH ===
        function createAnglerfish() {
            const group = new THREE.Group();

            // Body
            const bodyGeom = new THREE.SphereGeometry(1.8, 20, 14);
            const bodyPos = bodyGeom.attributes.position.array;
            for (let i = 0; i < bodyPos.length; i += 3) {
                if (bodyPos[i] > 0) bodyPos[i] *= 1.6;
                bodyPos[i] += (Math.random() - 0.5) * 0.1;
                bodyPos[i + 1] += (Math.random() - 0.5) * 0.1;
            }
            bodyGeom.computeVertexNormals();
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0x1a0a00,
                roughness: 1,
                metalness: 0,
            });
            const body = new THREE.Mesh(bodyGeom, bodyMat);
            group.add(body);

            // Huge mouth
            const mouthGeom = new THREE.SphereGeometry(1.2, 12, 8, 0, Math.PI * 2, 0, Math.PI * 0.6);
            const mouthMat = new THREE.MeshStandardMaterial({ color: 0x0a0000, roughness: 1 });
            const mouth = new THREE.Mesh(mouthGeom, mouthMat);
            mouth.position.set(2.2, -0.5, 0);
            mouth.rotation.z = Math.PI * 0.6;
            group.add(mouth);

            // Terrifying teeth
            for (let i = 0; i < 20; i++) {
                const toothSize = 0.05 + Math.random() * 0.1;
                const toothGeom = new THREE.ConeGeometry(toothSize, 0.2 + Math.random() * 0.4, 4);
                const toothMat = new THREE.MeshStandardMaterial({ color: 0xeeeecc, roughness: 0.3 });
                const tooth = new THREE.Mesh(toothGeom, toothMat);
                const angle = (i / 20) * Math.PI * 2;
                const r = 0.8 + Math.random() * 0.3;
                tooth.position.set(
                    2.2 + Math.cos(angle) * r * 0.3,
                    -0.5 + Math.sin(angle) * r,
                    Math.cos(angle) * r * 0.8
                );
                tooth.lookAt(2.2, -0.5, 0);
                group.add(tooth);
            }

            // Esca (bioluminescent lure)
            const stalkCurve = new THREE.CubicBezierCurve3(
                new THREE.Vector3(0, 1.5, 0),
                new THREE.Vector3(0.5, 3, 0),
                new THREE.Vector3(1.5, 3.5, 0),
                new THREE.Vector3(2, 3.2, 0)
            );
            const stalkGeom = new THREE.TubeGeometry(stalkCurve, 12, 0.03, 6, false);
            const stalk = new THREE.Mesh(stalkGeom, new THREE.MeshBasicMaterial({ color: 0x222222 }));
            group.add(stalk);

            // Lure bulb
            const lureGeom = new THREE.SphereGeometry(0.3, 12, 12);
            const lureMat = new THREE.MeshBasicMaterial({
                color: 0x88ffaa,
                transparent: true,
                opacity: 0.9,
            });
            const lure = new THREE.Mesh(lureGeom, lureMat);
            lure.position.set(2, 3.2, 0);
            group.add(lure);

            // Lure glow (dramatic)
            const lureGlow = new THREE.PointLight(0x44ff88, 15, 30);
            lureGlow.position.set(2, 3.2, 0);
            group.add(lureGlow);

            // Secondary glow
            const lureGlow2 = new THREE.PointLight(0x88ffcc, 5, 15);
            lureGlow2.position.copy(lureGlow.position);
            group.add(lureGlow2);

            // Eyes (small, menacing)
            for (let z of [0.8, -0.8]) {
                const eyeGeom = new THREE.SphereGeometry(0.2, 8, 8);
                const eye = new THREE.Mesh(eyeGeom, new THREE.MeshBasicMaterial({ color: 0xffaa00 }));
                eye.position.set(1.5, 0.5, z);
                group.add(eye);
            }

            group.userData = {
                type: 'anglerfish',
                speed: 0.06 + Math.random() * 0.08,
                lureGlow,
                wanderAngle: Math.random() * Math.PI * 2,
                phase: Math.random() * Math.PI * 2,
            };
            group.scale.setScalar(1.3);
            return group;
        }

        // === GIANT SQUID ===
        function createGiantSquid() {
            const group = new THREE.Group();
            const color = new THREE.Color().setHSL(0.95, 0.7, 0.25);
            const emColor = new THREE.Color().setHSL(0.95, 1, 0.3);

            // Mantle
            const mantleGeom = new THREE.LatheGeometry([
                new THREE.Vector2(0, -4),
                new THREE.Vector2(0.3, -3.5),
                new THREE.Vector2(1.2, -2),
                new THREE.Vector2(1.5, 0),
                new THREE.Vector2(1.3, 2),
                new THREE.Vector2(0.8, 3),
                new THREE.Vector2(0.2, 4),
            ], 16);
            const mantleMat = new THREE.MeshStandardMaterial({
                color,
                emissive: emColor,
                emissiveIntensity: 0.1,
                roughness: 0.5,
                metalness: 0.2,
            });
            const mantle = new THREE.Mesh(mantleGeom, mantleMat);
            mantle.rotation.x = Math.PI / 2;
            group.add(mantle);

            // Fins
            for (let z of [1, -1]) {
                const finShape = new THREE.Shape();
                finShape.moveTo(0, 0);
                finShape.quadraticCurveTo(2 * z, 1, 0, 3);
                const finGeom = new THREE.ShapeGeometry(finShape);
                const fin = new THREE.Mesh(finGeom, mantleMat);
                fin.position.set(-3, 0, z * 0.5);
                fin.rotation.y = z * 0.3;
                group.add(fin);
            }

            // Head
            const headGeom = new THREE.SphereGeometry(1.6, 16, 12);
            headGeom.scale(1, 1, 0.8);
            const head = new THREE.Mesh(headGeom, mantleMat);
            head.position.set(4, 0, 0);
            group.add(head);

            // Enormous eyes
            for (let z of [1.1, -1.1]) {
                const eyeGeom = new THREE.SphereGeometry(0.6, 12, 8);
                const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffdd00 });
                const eye = new THREE.Mesh(eyeGeom, eyeMat);
                eye.position.set(4.5, 0, z);
                group.add(eye);

                const pupil = new THREE.Mesh(
                    new THREE.SphereGeometry(0.25, 8, 8),
                    new THREE.MeshBasicMaterial({ color: 0x000000 })
                );
                pupil.position.set(4.9, 0, z);
                group.add(pupil);
            }

            // Tentacles (8 short + 2 long feeding tentacles)
            for (let i = 0; i < 10; i++) {
                const isLong = i < 2;
                const segments = isLong ? 16 : 10;
                const baseLen = isLong ? 15 : 7;
                const tentGroup = new THREE.Group();

                for (let s = 0; s < segments; s++) {
                    const t = s / segments;
                    const thickness = (1 - t * 0.8) * 0.2;
                    const segGeom = new THREE.SphereGeometry(thickness, 6, 4);
                    segGeom.scale(1, 2, 1);
                    const seg = new THREE.Mesh(segGeom, mantleMat);
                    seg.position.x = s * (baseLen / segments);
                    seg.userData = { idx: s, phase: Math.random() * Math.PI * 2 };

                    // Suckers on longer tentacles
                    if (isLong && s > segments * 0.6) {
                        const suckerGeom = new THREE.TorusGeometry(thickness * 0.6, thickness * 0.15, 6, 8);
                        const suckerMat = new THREE.MeshStandardMaterial({ color: 0xcc8866 });
                        const sucker = new THREE.Mesh(suckerGeom, suckerMat);
                        sucker.rotation.y = Math.PI / 2;
                        seg.add(sucker);
                    }
                    tentGroup.add(seg);
                }

                const angle = (i / 10) * Math.PI * 2;
                tentGroup.position.set(5, 0, 0);
                tentGroup.rotation.z = angle * 0.2;
                tentGroup.rotation.y = angle;
                tentGroup.userData = { phase: Math.random() * Math.PI * 2, isLong };
                group.add(tentGroup);
            }

            // Bioluminescent spots
            for (let i = 0; i < 20; i++) {
                const spotGeom = new THREE.SphereGeometry(0.05 + Math.random() * 0.08, 6, 6);
                const spotMat = new THREE.MeshBasicMaterial({
                    color: new THREE.Color().setHSL(0.5 + Math.random() * 0.3, 1, 0.7),
                });
                const spot = new THREE.Mesh(spotGeom, spotMat);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                spot.position.set(
                    Math.sin(phi) * Math.cos(theta) * 2 + (Math.random() - 0.5) * 4,
                    Math.sin(phi) * Math.sin(theta) * 1.5,
                    Math.cos(phi) * 1.5
                );
                group.add(spot);
            }

            group.userData = {
                type: 'giant_squid',
                speed: 0.1 + Math.random() * 0.1,
                wanderAngle: Math.random() * Math.PI * 2,
                phase: Math.random() * Math.PI * 2,
            };
            group.scale.setScalar(1.8);
            return group;
        }

        // === BIOLUMINESCENT SCHOOL ===
        function createBioSchool() {
            const group = new THREE.Group();
            const count = 20 + Math.floor(Math.random() * 30);
            const hue = 0.4 + Math.random() * 0.3;
            const baseColor = new THREE.Color().setHSL(hue, 1, 0.5);

            for (let i = 0; i < count; i++) {
                const fishGroup = new THREE.Group();
                const fishSize = 0.2 + Math.random() * 0.15;

                // Body
                const bodyGeom = new THREE.SphereGeometry(fishSize, 6, 4);
                bodyGeom.scale(2, 0.7, 0.7);
                const bodyMat = new THREE.MeshBasicMaterial({
                    color: baseColor,
                    transparent: true,
                    opacity: 0.9,
                });
                const body = new THREE.Mesh(bodyGeom, bodyMat);
                fishGroup.add(body);

                // Tail
                const tailGeom = new THREE.ConeGeometry(fishSize * 0.5, fishSize * 0.8, 4);
                const tail = new THREE.Mesh(tailGeom, bodyMat);
                tail.position.x = -fishSize * 1.5;
                tail.rotation.z = Math.PI / 2;

                    (Math.random() - 0.5) * 10,
                    (Math.random() - 0.5) * 5,

                );

                    offset: fishGroup.position.clone(),

                };

            // School glow

                wanderAngle: Math.random() * Math.PI * 2,
                phase: Math.random() * Math.PI * 2,
            };
            return group;
        }

        // === MANTA RAY ===
        function createMantaRay() {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0x1a1a3a,
                roughness: 0.5,
                metalness: 0.4,
                side: THREE.DoubleSide,
            });

            // Body (flattened ellipsoid)
            const bodyGeom = new THREE.SphereGeometry(1.5, 20, 10);
            bodyGeom.scale(1.5, 0.2, 1);
            const body = new THREE.Mesh(bodyGeom, bodyMat);
            group.add(body);

            // Wings (large, graceful)
            for (let side of [-1, 1]) {
                const wingGeom = new THREE.PlaneGeometry(5, 3, 10, 5);
                const wingPos = wingGeom.attributes.position.array;
                for (let i = 0; i < wingPos.length; i += 3) {
                    // Taper the wing
                    const dist = Math.abs(wingPos[i + 1]) / 1.5;
                    wingPos[i] *= (1 - dist * 0.3);
                    // Curve the wing
                    wingPos[i + 2] = Math.pow(Math.abs(wingPos[i + 1]) / 1.5, 1.5) * 0.5 * side;
                }
                wingGeom.computeVertexNormals();
                const wing = new THREE.Mesh(wingGeom, bodyMat);
                wing.position.z = side * 2;
                wing.rotation.x = side * 0.05;
                wing.userData = { side, baseRot: side * 0.05 };
                group.add(wing);
            }

            // Tail (long, whip-like)
            const tailCurve = new THREE.CubicBezierCurve3(
                new THREE.Vector3(-1.5, 0, 0),
                new THREE.Vector3(-3, 0.2, 0),
                new THREE.Vector3(-5, 0, 0),
                new THREE.Vector3(-6, -0.5, 0)
            );
            const tailGeom = new THREE.TubeGeometry(tailCurve, 12, 0.08, 6, false);
            const tail = new THREE.Mesh(tailGeom, bodyMat);
            group.add(tail);

            // Cephalic fins (horn-like)
            for (let z of [-0.4, 0.4]) {
                const hornGeom = new THREE.CylinderGeometry(0.05, 0.12, 1.2, 6);
                const horn = new THREE.Mesh(hornGeom, bodyMat);
                horn.position.set(1.8, 0, z);
                horn.rotation.z = -0.8;
                horn.rotation.y = z;

            // White belly
            const bellyGeom = new THREE.SphereGeometry(1.3, 16, 8);

            const bellyMat = new THREE.MeshStandardMaterial({ color: 0xccccdd, roughness: 0.5 });
            const belly = new THREE.Mesh(bellyGeom, bellyMat);
            belly.position.y = -0.1;
            group.add(belly);

            // Spots pattern
            for (let i = 0; i < 12; i++) {
                const spotGeom = new THREE.CircleGeometry(0.1 + Math.random() * 0.2, 8);
                const spotMat = new THREE.MeshBasicMaterial({
                    color: 0x334466,
                    transparent: true,
                    opacity: 0.3,
                    side: THREE.DoubleSide,
                });
                const spot = new THREE.Mesh(spotGeom, spotMat);
                spot.position.set(
                    (Math.random() - 0.5) * 2,
                    0.16,
                    (Math.random() - 0.5) * 3
                );
                spot.rotation.x = -Math.PI / 2;
                group.add(spot);

            group.scale.setScalar(2.5);
            return group;
        }

        // === WHALE ===
        function createWhale() {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0x1a2a3a,
                roughness: 0.6,
                metalness: 0.15,
            });

            // Body (using lathe for smooth profile)
            const bodyProfile = [
                new THREE.Vector2(0, -8),
                new THREE.Vector2(1, -7),
                new THREE.Vector2(2.5, -4),
                new THREE.Vector2(3, 0),
                new THREE.Vector2(2.8, 3),
                new THREE.Vector2(2, 5),
                new THREE.Vector2(1.5, 6),
                new THREE.Vector2(0.8, 7),
                new THREE.Vector2(0.3, 8),
            ];
            const bodyGeom = new THREE.LatheGeometry(bodyProfile, 20);
            const body = new THREE.Mesh(bodyGeom, bodyMat);
            body.rotation.z = Math.PI / 2;
            group.add(body);

            // Fluke (tail)
            const flukeGeom = new THREE.PlaneGeometry(6, 2, 4, 2);
            const flukeMat = new THREE.MeshStandardMaterial({ color: 0x1a2a3a, side: THREE.DoubleSide, roughness: 0.6 });
            const fluke = new THREE.Mesh(flukeGeom, flukeMat);
            fluke.position.set(-9, 0, 0);
            fluke.rotation.y = Math.PI / 2;
            group.add(fluke);

            // Pectoral fins
            for (let z of [-1, 1]) {
                const finGeom = new THREE.PlaneGeometry(3, 1.2, 3, 2);
                const fin = new THREE.Mesh(finGeom, flukeMat);
                fin.position.set(2, -1, z * 3);
                fin.rotation.x = z * 0.3;
                fin.rotation.y = z * 0.5;
                group.add(fin);
            }

            // Throat grooves
            const bellyGeom = new THREE.SphereGeometry(2.6, 16, 8);
            bellyGeom.scale(2.5, 0.9, 0.9);
            const bellyMat = new THREE.MeshStandardMaterial({
                color: 0x445566,
                roughness: 0.5,
            });
            const belly = new THREE.Mesh(bellyGeom, bellyMat);
            belly.position.set(2, -1.5, 0);
            group.add(belly);

            // Eye
            for (let z of [2.5, -2.5]) {
                const eyeGeom = new THREE.SphereGeometry(0.2, 8, 8);
                const eye = new THREE.Mesh(eyeGeom, new THREE.MeshBasicMaterial({ color: 0x111122 }));
                eye.position.set(5, 0.5, z);
                group.add(eye);
            }

            group.userData = {
                type: 'whale',
                speed: 0.06 + Math.random() * 0.04,
                wanderAngle: Math.random() * Math.PI * 2,
                phase: Math.random() * Math.PI * 2,
                fluke,
            };
            group.scale.setScalar(1.2);
            return group;
        }

        // === DRAGONFISH ===
        function createDragonfish() {
            const group = new THREE.Group();

            const bodyGeom = new THREE.CylinderGeometry(0.15, 0.12, 4, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.9 });
            const body = new THREE.Mesh(bodyGeom, bodyMat);
            body.rotation.z = Math.PI / 2;
            group.add(body);

            // Photophores - dramatic bioluminescence
            const lightColors = [0x00ffff, 0xff00ff, 0x0088ff, 0x00ff88];
            for (let i = 0; i < 20; i++) {
                const pGeom = new THREE.SphereGeometry(0.03, 6, 6);
                const col = lightColors[i % lightColors.length];
                const pMat = new THREE.MeshBasicMaterial({ color: col });
                const photophore = new THREE.Mesh(pGeom, pMat);
                photophore.position.set(
                    -1.8 + i * 0.19,
                    -0.12 + (Math.random() - 0.5) * 0.05,
                    (i % 2 === 0 ? 0.1 : -0.1)
                );
                group.add(photophore);
            }

            // Side lights
            for (let i = 0; i < 3; i++) {
                const light = new THREE.PointLight(lightColors[i], 3, 8);
                light.position.set(-1 + i * 1, -0.12, 0);
                group.add(light);
            }

            // Jaw with fangs
            const jawGeom = new THREE.ConeGeometry(0.25, 1, 6);
            const jaw = new THREE.Mesh(jawGeom, bodyMat);
            jaw.position.set(2.2, -0.2, 0);
            jaw.rotation.z = -Math.PI / 5;
            group.add(jaw);

            for (let i = 0; i < 8; i++) {
                const fangGeom = new THREE.ConeGeometry(0.01, 0.3 + Math.random() * 0.2, 4);
                const fang = new THREE.Mesh(fangGeom, new THREE.MeshBasicMaterial({ color: 0xddddcc }));
                fang.position.set(1.8 + i * 0.06, 0.05, (i % 2 === 0 ? 0.08 : -0.08));
                group.add(fang);
            }

            // Chin barbel
            const barbelGeom = new THREE.CylinderGeometry(0.008, 0.008, 3, 4);
            const barbel = new THREE.Mesh(barbelGeom, new THREE.MeshBasicMaterial({ color: 0x111111 }));
            barbel.position.set(1.8, -1.5, 0);
            group.add(barbel);

            const barbelTip = new THREE.Mesh(
                new THREE.SphereGeometry(0.08, 6, 6),
                new THREE.MeshBasicMaterial({ color: 0x00ffff })
            );
            barbelTip.position.set(1.8, -3, 0);
            group.add(barbelTip);

            const barbelGlow = new THREE.PointLight(0x00ffff, 8, 15);
            barbelGlow.position.set(1.8, -3, 0);
            group.add(barbelGlow);

            group.userData = {
                type: 'dragonfish',
                speed: 0.1 + Math.random() * 0.1,
                wanderAngle: Math.random() * Math.PI * 2,
                phase: Math.random() * Math.PI * 2,
                barbelGlow,
            };
            group.scale.setScalar(2.5);
            return group;
        }

        // === NAUTILUS ===
        function createNautilus() {
            const group = new THREE.Group();

            // Shell (spiral)
            const shellMat = new THREE.MeshPhysicalMaterial({
                color: 0xcc8844,
                metalness: 0.3,
                roughness: 0.4,
                clearcoat: 0.8,
            });

            const shellGeom = new THREE.TorusGeometry(1, 0.6, 12, 24);
            const shell = new THREE.Mesh(shellGeom, shellMat);
            shell.scale.set(1, 1, 0.6);
            group.add(shell);

            // Inner whorls
            const innerGeom = new THREE.TorusGeometry(0.5, 0.35, 8, 16);
            const inner = new THREE.Mesh(innerGeom, shellMat);
            inner.scale.set(1, 1, 0.6);
            inner.position.x = 0.3;
            group.add(inner);

            // Stripes
            for (let i = 0; i < 8; i++) {
                const stripeGeom = new THREE.TorusGeometry(1.01, 0.03, 6, 24);
                const stripeMat = new THREE.MeshBasicMaterial({
                    color: 0x663311,
                    transparent: true,
                    opacity: 0.5,
                });
                const stripe = new THREE.Mesh(stripeGeom, stripeMat);
                stripe.scale.set(1, 1, 0.6);
                stripe.rotation.y = (i / 8) * Math.PI * 0.5;
                group.add(stripe);
            }

            // Tentacles
            for (let i = 0; i < 12; i++) {
                const tentGeom = new THREE.CylinderGeometry(0.03, 0.02, 1.5, 4);
                const tentMat = new THREE.MeshStandardMaterial({ color: 0xddaa77, roughness: 0.7 });
                const tent = new THREE.Mesh(tentGeom, tentMat);
                const angle = (i / 12) * Math.PI * 2;
                tent.position.set(
                    1.5 + Math.cos(angle) * 0.3,
                    Math.sin(angle) * 0.3,
                    0
                );
                tent.rotation.z = -Math.PI / 3;
                tent.userData = { phase: Math.random() * Math.PI * 2 };
                group.add(tent);
            }

            // Eye
            const eyeGeom = new THREE.SphereGeometry(0.15, 8, 8);
            const eye = new THREE.Mesh(eyeGeom, new THREE.MeshBasicMaterial({ color: 0x111111 }));
            eye.position.set(1.2, 0.3, 0.5);
            group.add(eye);
            const eye2 = eye.clone();
            eye2.position.z = -0.5;
            group.add(eye2);

            group.userData = {
                type: 'nautilus',
                speed: 0.08 + Math.random() * 0.06,
                wanderAngle: Math.random() * Math.PI * 2,
                phase: Math.random() * Math.PI * 2,
            };
            group.scale.setScalar(1.5);
            return group;
        }

        // === OARFISH (sea serpent) ===
        function createOarfish() {
            const group = new THREE.Group();
            const segments = 40;
            const length = 20;

            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0x667788,
                metalness: 0.4,
                roughness: 0.3,
            });

            for (let i = 0; i < segments; i++) {
                const t = i / segments;
                const thickness = 0.3 * (1 - t * 0.5);
                const segGeom = new THREE.SphereGeometry(thickness, 6, 4);
                segGeom.scale(1, 1, 1.5);
                const seg = new THREE.Mesh(segGeom, bodyMat);
                seg.position.x = i * (length / segments);
                seg.userData = { idx: i, phase: i * 0.3 };

                // Dorsal fin (red crest)
                if (i < segments * 0.3) {
                    const finH = 0.5 * (1 - t * 2);
                    if (finH > 0) {
                        const finGeom = new THREE.PlaneGeometry(length / segments, finH);
                        const finMat = new THREE.MeshStandardMaterial({
                            color: 0xff2200,
                            emissive: 0xff4400,
                            emissiveIntensity: 0.2,
                            side: THREE.DoubleSide,
                        });
                        const fin = new THREE.Mesh(finGeom, finMat);
                        fin.position.y = thickness + finH / 2;
                        seg.add(fin);
                    }
                }
                group.add(seg);
            }

            // Eye
            const eyeGeom = new THREE.SphereGeometry(0.12, 8, 8);
            const eye = new THREE.Mesh(eyeGeom, new THREE.MeshBasicMaterial({ color: 0xffaa00 }));
            eye.position.set(-0.1, 0.15, 0.2);
            group.children[0].add(eye);

            group.userData = {
                type: 'oarfish',
                speed: 0.12 + Math.random() * 0.08,
                wanderAngle: Math.random() * Math.PI * 2,
                phase: Math.random() * Math.PI * 2,
                segments,
                length,
            };
            group.scale.setScalar(1.5);
            return group;
        }

        // === CUTTLEFISH ===
        function createCuttlefish() {
            const group = new THREE.Group();

            // Body
            const bodyGeom = new THREE.SphereGeometry(1, 16, 12);
            bodyGeom.scale(2, 0.5, 1);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0x886644,
                roughness: 0.6,
                metalness: 0.2,
            });
            const body = new THREE.Mesh(bodyGeom, bodyMat);
            group.add(body);

            // Undulating fin
            const finGeom = new THREE.PlaneGeometry(4, 0.8, 20, 3);
            const finMat = new THREE.MeshStandardMaterial({
                color: 0x998866,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.7,
            });
            const finTop = new THREE.Mesh(finGeom, finMat);
            finTop.position.y = 0.3;
            finTop.rotation.x = Math.PI / 2;
            group.add(finTop);

            // Arms (8)
            for (let i = 0; i < 8; i++) {
                const armGeom = new THREE.CylinderGeometry(0.06, 0.03, 2, 6);
                const arm = new THREE.Mesh(armGeom, bodyMat);
                const angle = (i / 8) * Math.PI - Math.PI / 2;
                arm.position.set(2 + Math.cos(angle) * 0.3, Math.sin(angle) * 0.2, (i - 4) * 0.15);
                arm.rotation.z = -Math.PI / 3;
                arm.userData = { phase: Math.random() * Math.PI * 2 };
                group.add(arm);
            }

            // Eyes (W-shaped pupils)
            for (let z of [0.6, -0.6]) {
                const eyeGeom = new THREE.SphereGeometry(0.25, 12, 8);
                const eyeMat = new THREE.MeshBasicMaterial({ color: 0x44ff44 });
                const eye = new THREE.Mesh(eyeGeom, eyeMat);
                eye.position.set(1.5, 0.2, z);
                group.add(eye);
            }

            // Color-changing chromatophores (emissive spots)
            for (let i = 0; i < 15; i++) {
                const spotGeom = new THREE.SphereGeometry(0.08, 6, 6);
                const spotMat = new THREE.MeshBasicMaterial({
                    color: new THREE.Color().setHSL(Math.random(), 1, 0.5),
                    transparent: true,
                    opacity: 0.6,
                });
                const spot = new THREE.Mesh(spotGeom, spotMat);
                spot.position.set(
                    (Math.random() - 0.5) * 3,
                    0.3,
                    (Math.random() - 0.5) * 1.5
                );
                spot.userData = { huePhase: Math.random() * Math.PI * 2 };
                group.add(spot);
            }

            group.userData = {
                type: 'cuttlefish',
                speed: 0.1 + Math.random() * 0.08,
                wanderAngle: Math.random() * Math.PI * 2,
                phase: Math.random() * Math.PI * 2,
            };
            group.scale.setScalar(1.8);
            return group;
        }

        // === SEA TURTLE ===
        function createSeaTurtle() {
            const group = new THREE.Group();

            // Shell
            const shellGeom = new THREE.SphereGeometry(1.2, 16, 10);
            shellGeom.scale(1.3, 0.5, 1);
            const shellMat = new THREE.MeshStandardMaterial({
                color: 0x2d4a27,
                roughness: 0.8,
                metalness: 0.1,
            });
            const shell = new THREE.Mesh(shellGeom, shellMat);
            group.add(shell);

            // Scutes (shell pattern)
            for (let i = 0; i < 5; i++) {
                const scuteGeom = new THREE.CircleGeometry(0.3, 6);
                const scuteMat = new THREE.MeshStandardMaterial({
                    color: 0x3d5a37,
                    side: THREE.DoubleSide,
                });
                const scute = new THREE.Mesh(scuteGeom, scuteMat);
                scute.position.set((i - 2) * 0.4, 0.52, 0);
                scute.rotation.x = -Math.PI / 2;
                group.add(scute);
            }

            // Head
            const headGeom = new THREE.SphereGeometry(0.35, 10, 8);
            const headMat = new THREE.MeshStandardMaterial({ color: 0x3d6a37, roughness: 0.7 });
            const head = new THREE.Mesh(headGeom, headMat);
            head.position.set(1.5, 0, 0);
            head.scale.x = 1.3;
            group.add(head);

            // Flippers (large front, small back)
            const flipperMat = new THREE.MeshStandardMaterial({ color: 0x3d6a37, roughness: 0.7 });
            const frontFlipGeom = new THREE.BoxGeometry(1.5, 0.1, 0.6);
            const fl1 = new THREE.Mesh(frontFlipGeom, flipperMat);
            fl1.position.set(0.5, -0.15, 1.2);
            fl1.rotation.y = 0.4;
            group.add(fl1);
            const fl2 = fl1.clone();
            fl2.position.z = -1.2;
            fl2.rotation.y = -0.4;
            group.add(fl2);

            const backFlipGeom = new THREE.BoxGeometry(0.8, 0.08, 0.4);
            const fl3 = new THREE.Mesh(backFlipGeom, flipperMat);
            fl3.position.set(-1.1, -0.1, 0.8);
            group.add(fl3);
            const fl4 = fl3.clone();
            fl4.position.z = -0.8;
            group.add(fl4);

            // Eyes
            for (let z of [0.25, -0.25]) {
                const eyeGeom = new THREE.SphereGeometry(0.06, 6, 6);
                const eye = new THREE.Mesh(eyeGeom, new THREE.MeshBasicMaterial({ color: 0x111111 }));
                eye.position.set(1.7, 0.1, z);
                group.add(eye);
            }

            group.userData = {
                type: 'sea_turtle',
                speed: 0.1 + Math.random() * 0.08,
                wanderAngle: Math.random() * Math.PI * 2,
                phase: Math.random() * Math.PI * 2,
                flippers: [fl1, fl2, fl3, fl4],
            };
            group.scale.setScalar(2);
            return group;
        }

        // === SPAWN WORLD ===
        function spawnCreature(createFn, position, args) {
            const creature = args ? createFn(args) : createFn();
            creature.position.copy(position);
            creature.rotation.y = Math.random() * Math.PI * 2;
            scene.add(creature);
            creatures.push(creature);
            return creature;
        }
