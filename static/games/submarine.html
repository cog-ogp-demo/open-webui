<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Water — Submarine Explorer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #000;
            font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
            cursor: none;
        }
        canvas { display: block; }

        #loading {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 50% 60%, #021a2b 0%, #000508 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            transition: opacity 2.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #loading h1 {
            color: #5cf0d3;
            font-size: clamp(24px, 4vw, 42px);
            font-weight: 300;
            text-shadow: 0 0 40px rgba(92, 240, 211, 0.6);
            letter-spacing: 8px;
            margin-bottom: 8px;
        }
        #loading .subtitle {
            color: rgba(92, 240, 211, 0.4);
            font-size: 11px;
            letter-spacing: 3px;
            margin-bottom: 40px;
        }
        .load-ring {
            width: 60px;
            height: 60px;
            border: 2px solid rgba(92, 240, 211, 0.1);
            border-top: 2px solid rgba(92, 240, 211, 0.8);
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
        }
        .vignette {
            background: radial-gradient(ellipse at 50% 50%,
                transparent 40%,
                rgba(0, 8, 20, 0.4) 70%,
                rgba(0, 4, 12, 0.85) 100%);
        }

        #hud {
            position: fixed;
            top: 24px;
            left: 24px;
            pointer-events: none;
            z-index: 200;
        }
        .hud-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 4px;
        }
        .hud-label {
            color: rgba(92, 240, 211, 0.4);
            font-size: 9px;
            letter-spacing: 1.5px;
            min-width: 55px;
        }
        .hud-value {
            color: rgba(92, 240, 211, 0.9);
            font-size: 14px;
            font-weight: 500;
            text-shadow: 0 0 12px rgba(92, 240, 211, 0.4);
        }
        #zone-display {
            margin-top: 12px;
            padding: 4px 10px;
            background: rgba(92, 240, 211, 0.06);
            border-left: 2px solid rgba(92, 240, 211, 0.3);
            color: rgba(92, 240, 211, 0.7);
            font-size: 10px;
            letter-spacing: 2px;
        }

        #creature-toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            color: rgba(200, 160, 255, 0.9);
            font-size: 13px;
            text-align: center;
            text-shadow: 0 0 20px rgba(200, 160, 255, 0.4);
            pointer-events: none;
            z-index: 200;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            line-height: 1.6;
        }
        #creature-toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        #controls-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(92, 240, 211, 0.25);
            font-size: 10px;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 200;
            transition: opacity 3s;
        }

        #zone-announce {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(92, 240, 211, 0.9);
            font-size: clamp(20px, 3vw, 36px);
            font-weight: 200;
            letter-spacing: 10px;
            text-shadow: 0 0 50px rgba(92, 240, 211, 0.5);
            pointer-events: none;
            z-index: 200;
            opacity: 0;
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #depth-bar {
            position: fixed;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            width: 2px;
            height: 160px;
            background: rgba(92, 240, 211, 0.06);
            border-radius: 1px;
            pointer-events: none;
            z-index: 200;
        }
        #depth-bar-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            border-radius: 1px;
            background: linear-gradient(to top, #f06292, #ffab40, #5cf0d3);
            transition: height 0.4s ease;
            box-shadow: 0 0 6px rgba(92, 240, 211, 0.3);
        }
        #depth-label {
            position: fixed;
            right: 34px;
            color: rgba(92, 240, 211, 0.5);
            font-size: 9px;
            pointer-events: none;
            z-index: 200;
            transition: top 0.4s ease;
        }
    </style>
</head>
<body>

<div id="loading">
    <h1>DEEP WATER</h1>
    <div class="subtitle">SUBMARINE EXPLORER</div>
    <div class="load-ring"></div>
</div>

<div class="overlay vignette"></div>

<div id="hud">
    <div class="hud-row"><span class="hud-label">DEPTH</span><span class="hud-value" id="hud-depth">0 m</span></div>
    <div class="hud-row"><span class="hud-label">SPEED</span><span class="hud-value" id="hud-speed">0.0 kn</span></div>
    <div class="hud-row"><span class="hud-label">BEARING</span><span class="hud-value" id="hud-bearing">000°</span></div>
    <div class="hud-row"><span class="hud-label">SPECIES</span><span class="hud-value" id="hud-species">0 / 10</span></div>
    <div id="zone-display">SUNLIGHT ZONE</div>
</div>

<div id="depth-bar"><div id="depth-bar-fill" style="height:3%"></div></div>
<div id="depth-label" style="top:50%">0m</div>

<div id="zone-announce"></div>
<div id="creature-toast"></div>
<div id="controls-hint">W/S move · A/D turn · Q/E dive · SHIFT boost · MOUSE look · click to start</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// ─── CONFIG ───────────────────────────────────────────────
const WORLD_SIZE = 300;
const MAX_DEPTH = 120;
const SUB_START_DEPTH = -8;

// ─── RENDERER ─────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.8;
document.body.appendChild(renderer.domElement);

// ─── SCENE ────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x041e30, 0.006);
scene.background = new THREE.Color(0x021a2b);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.5, 400);

// ─── POST-PROCESSING ──────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.8, 0.5, 0.75
);
composer.addPass(bloom);

// Underwater color grading
const ColorGradeShader = {
    uniforms: { tDiffuse: { value: null }, depth: { value: 0 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float depth;
        varying vec2 vUv;
        void main(){
            vec4 c = texture2D(tDiffuse, vUv);
            // Gentle underwater tint that increases with depth
            float d = depth * depth;
            c.r *= mix(1.0, 0.55, d);
            c.g *= mix(1.0, 0.8, d * 0.7);
            c.b *= mix(1.0, 1.1, d * 0.4);
            // Subtle vignette
            float v = 1.0 - smoothstep(0.5, 1.5, length(vUv - 0.5) * 1.6);
            c.rgb *= mix(0.8, 1.0, v);
            gl_FragColor = c;
        }
    `
};
const colorGrade = new ShaderPass(ColorGradeShader);
composer.addPass(colorGrade);

// ─── LIGHTING (minimal, atmospheric) ─────────────────────
const ambient = new THREE.AmbientLight(0x4488aa, 2.0);
scene.add(ambient);

// Single directional "god ray" from surface
const sunDir = new THREE.DirectionalLight(0xaaddff, 2.0);
sunDir.position.set(30, 100, -20);
scene.add(sunDir);

// Submarine headlamps (only 2 lights for the whole sub)
const headlamp = new THREE.SpotLight(0xc8e8ff, 40, 140, Math.PI / 4, 0.5, 1.2);
scene.add(headlamp);
scene.add(headlamp.target);

const fillLight = new THREE.PointLight(0x66aadd, 10, 45);
scene.add(fillLight);

// Back fill so submarine is visible from camera
const backFill = new THREE.PointLight(0x5599bb, 5, 25);
scene.add(backFill);

// ─── SUBMARINE ────────────────────────────────────────────
const sub = new THREE.Group();

// Hull — smooth, organic shape
const hullMat = new THREE.MeshStandardMaterial({
    color: 0x3d5a6e,
    metalness: 0.7,
    roughness: 0.25,
    envMapIntensity: 0.4,
});
const hull = new THREE.Mesh(new THREE.CapsuleGeometry(0.7, 4.2, 12, 20), hullMat);
hull.rotation.z = Math.PI / 2;
sub.add(hull);

// Sail (conning tower)
const sail = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.25, 0.6, 8, 12),
    hullMat
);
sail.position.set(-0.3, 0.9, 0);
sub.add(sail);

// Viewport (glowing dome)
const viewportMat = new THREE.MeshStandardMaterial({
    color: 0x80ffd4,
    emissive: 0x40c8a0,
    emissiveIntensity: 0.6,
    metalness: 0,
    roughness: 0.1,
    transparent: true,
    opacity: 0.85,
});
const viewport = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 12), viewportMat);
viewport.position.set(1.8, 0.3, 0);
sub.add(viewport);

// Headlight housings
for (const z of [-0.35, 0.35]) {
    const hlHouse = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08, 0.1, 0.15, 8),
        new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 2 })
    );
    hlHouse.rotation.z = Math.PI / 2;
    hlHouse.position.set(2.3, 0.2, z);
    sub.add(hlHouse);
}

// Fins
const finMat = new THREE.MeshStandardMaterial({ color: 0x2d4a5e, metalness: 0.8, roughness: 0.3 });
const finH = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.03, 0.6), finMat);
finH.position.set(-2.0, 0, 0);
sub.add(finH);
const finV = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.6, 0.03), finMat);
finV.position.set(-2.0, 0, 0);
sub.add(finV);

// Front dive planes
for (const z of [-0.75, 0.75]) {
    const dp = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.025, 0.35), finMat);
    dp.position.set(1.5, 0, z);
    sub.add(dp);
}

// Propeller
const propGroup = new THREE.Group();
propGroup.position.set(-2.8, 0, 0);
for (let i = 0; i < 4; i++) {
    const blade = new THREE.Mesh(
        new THREE.BoxGeometry(0.04, 0.5, 0.15),
        finMat
    );
    blade.rotation.x = (i / 4) * Math.PI * 2;
    blade.position.y = Math.sin(blade.rotation.x) * 0.2;
    blade.position.z = Math.cos(blade.rotation.x) * 0.2;
    propGroup.add(blade);
}
sub.add(propGroup);

// Running lights
const rlGreen = new THREE.Mesh(
    new THREE.SphereGeometry(0.04, 6, 6),
    new THREE.MeshBasicMaterial({ color: 0x00ff88 })
);
rlGreen.position.set(0, 0, 0.75);
sub.add(rlGreen);
const rlRed = new THREE.Mesh(
    new THREE.SphereGeometry(0.04, 6, 6),
    new THREE.MeshBasicMaterial({ color: 0xff3344 })
);
rlRed.position.set(0, 0, -0.75);
sub.add(rlRed);

sub.position.set(0, SUB_START_DEPTH, 0);
scene.add(sub);

// ─── SUBMARINE PHYSICS ────────────────────────────────────
const physics = { speed: 0, maxSpeed: 0.3, boost: 0.65, accel: 0.004, drag: 0.993, turnRate: 0.013, roll: 0 };
let mouseX = 0, mouseY = 0, locked = false;
const keys = {};

document.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
renderer.domElement.addEventListener('click', () => {
    if (!locked) renderer.domElement.requestPointerLock();
    initAudio();
});
document.addEventListener('pointerlockchange', () => { locked = !!document.pointerLockElement; });
document.addEventListener('mousemove', e => {
    if (!locked) return;
    mouseX += e.movementX * 0.0012;
    mouseY = Math.max(-0.5, Math.min(0.5, mouseY + e.movementY * 0.0006));
});

// ─── AUDIO ────────────────────────────────────────────────
let audioStarted = false;
function initAudio() {
    if (audioStarted) return;
    audioStarted = true;
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const master = ctx.createGain();
    master.gain.value = 0.25;
    master.connect(ctx.destination);

    // Low ambient drone
    [48, 72, 96].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        const flt = ctx.createBiquadFilter();
        osc.type = 'sine';
        osc.frequency.value = freq;
        g.gain.value = [0.06, 0.03, 0.015][i];
        flt.type = 'lowpass';
        flt.frequency.value = 150;
        osc.connect(flt);
        flt.connect(g);
        g.connect(master);
        osc.start();
    });

    // Occasional whale sound
    setInterval(() => {
        if (Math.random() > 0.4) return;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(60 + Math.random() * 40, ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(30 + Math.random() * 20, ctx.currentTime + 4);
        g.gain.setValueAtTime(0, ctx.currentTime);
        g.gain.linearRampToValueAtTime(0.02, ctx.currentTime + 0.8);
        g.gain.linearRampToValueAtTime(0, ctx.currentTime + 4);
        o.connect(g); g.connect(master);
        o.start(); o.stop(ctx.currentTime + 4);
    }, 10000);
}

// ─── OCEAN FLOOR ──────────────────────────────────────────
const floorGeo = new THREE.PlaneGeometry(WORLD_SIZE * 2, WORLD_SIZE * 2, 80, 80);
const floorPos = floorGeo.attributes.position.array;
for (let i = 0; i < floorPos.length; i += 3) {
    const x = floorPos[i], y = floorPos[i + 1];
    floorPos[i + 2] = Math.sin(x * 0.015) * 6 + Math.cos(y * 0.012) * 5 +
        Math.sin(x * 0.04 + y * 0.03) * 2 + (Math.random() - 0.5) * 1.5;
}
floorGeo.computeVertexNormals();
const floor = new THREE.Mesh(floorGeo, new THREE.MeshStandardMaterial({
    color: 0x0a1a12,
    roughness: 0.95,
    metalness: 0.05,
}));
floor.rotation.x = -Math.PI / 2;
floor.position.y = -MAX_DEPTH;
scene.add(floor);

// ─── GOD RAYS (volumetric light shafts) ──────────────────
const rayGroup = new THREE.Group();
for (let i = 0; i < 12; i++) {
    const geo = new THREE.CylinderGeometry(0.2 + Math.random() * 0.8, 4 + Math.random() * 6, 100 + Math.random() * 60, 4, 1, true);
    const mat = new THREE.MeshBasicMaterial({
        color: 0x88ddff,
        transparent: true,
        opacity: 0.02 + Math.random() * 0.015,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
    });
    const ray = new THREE.Mesh(geo, mat);
    ray.position.set((Math.random() - 0.5) * 120, 20 + Math.random() * 30, (Math.random() - 0.5) * 120);
    ray.rotation.set((Math.random() - 0.5) * 0.2, 0, (Math.random() - 0.5) * 0.2);
    rayGroup.add(ray);
}
scene.add(rayGroup);

// ─── PARTICLES: MARINE SNOW ──────────────────────────────
const snowCount = 4000;
const snowGeo = new THREE.BufferGeometry();
const snowPos = new Float32Array(snowCount * 3);
for (let i = 0; i < snowCount * 3; i += 3) {
    snowPos[i] = (Math.random() - 0.5) * WORLD_SIZE;
    snowPos[i + 1] = Math.random() * (MAX_DEPTH + 20) - MAX_DEPTH;
    snowPos[i + 2] = (Math.random() - 0.5) * WORLD_SIZE;
}
snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
const snow = new THREE.Points(snowGeo, new THREE.PointsMaterial({
    color: 0x99bbcc,
    size: 0.12,
    transparent: true,
    opacity: 0.35,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true,
    depthWrite: false,
}));
scene.add(snow);

// ─── ENVIRONMENT OBJECTS ─────────────────────────────────

// Rocks
for (let i = 0; i < 50; i++) {
    const size = 1 + Math.random() * 5;
    const geo = new THREE.IcosahedronGeometry(size, 1);
    const pos = geo.attributes.position.array;
    for (let j = 0; j < pos.length; j++) pos[j] += (Math.random() - 0.5) * size * 0.3;
    geo.computeVertexNormals();
    const rock = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(0.1, 0.08, 0.06 + Math.random() * 0.04),
        roughness: 0.95,
    }));
    rock.position.set(
        (Math.random() - 0.5) * WORLD_SIZE * 1.5,
        -MAX_DEPTH + Math.random() * 5,
        (Math.random() - 0.5) * WORLD_SIZE * 1.5
    );
    rock.rotation.set(Math.random(), Math.random(), Math.random());
    scene.add(rock);
}

// Coral (emissive, no lights needed)
const coralColors = [[0xff2070, 0.3], [0xff6030, 0.25], [0xbb40ff, 0.35], [0x20ffa0, 0.4], [0xff3090, 0.3], [0x40a0ff, 0.3]];
for (let i = 0; i < 80; i++) {
    const [col, emI] = coralColors[Math.floor(Math.random() * coralColors.length)];
    const type = Math.random();
    let mesh;

    if (type < 0.33) {
        // Branch coral
        const g = new THREE.Group();
        const bCount = 3 + Math.floor(Math.random() * 5);
        for (let b = 0; b < bCount; b++) {
            const h = 1 + Math.random() * 3;
            const branch = new THREE.Mesh(
                new THREE.CylinderGeometry(0.03, 0.08, h, 5),
                new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: emI, roughness: 0.7 })
            );
            branch.position.set((Math.random() - 0.5) * 0.8, h / 2, (Math.random() - 0.5) * 0.8);
            branch.rotation.set((Math.random() - 0.5) * 0.3, 0, (Math.random() - 0.5) * 0.3);
            g.add(branch);
        }
        mesh = g;
    } else if (type < 0.66) {
        // Fan coral
        mesh = new THREE.Mesh(
            new THREE.CircleGeometry(1 + Math.random() * 1.5, 12),
            new THREE.MeshStandardMaterial({
                color: col, emissive: col, emissiveIntensity: emI * 0.6,
                side: THREE.DoubleSide, transparent: true, opacity: 0.75, roughness: 0.6
            })
        );
        mesh.rotation.x = -0.3 + Math.random() * 0.6;
        mesh.position.y = 1.5;
    } else {
        // Brain coral
        mesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.5 + Math.random() * 0.8, 10, 8),
            new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: emI, roughness: 0.85 })
        );
        mesh.scale.y = 0.5;
        mesh.position.y = 0.4;
    }

    const wrapper = mesh.isGroup ? mesh : new THREE.Group().add(mesh) && mesh.parent;
    (wrapper || mesh).position.set(
        (Math.random() - 0.5) * WORLD_SIZE * 1.2,
        -MAX_DEPTH + 0.5,
        (Math.random() - 0.5) * WORLD_SIZE * 1.2
    );
    (wrapper || mesh).scale.setScalar(0.6 + Math.random() * 1.5);
    scene.add(wrapper || mesh);
}

// Kelp (simple, performant)
for (let i = 0; i < 60; i++) {
    const segs = 6 + Math.floor(Math.random() * 6);
    const h = 8 + Math.random() * 18;
    const kelpGroup = new THREE.Group();
    for (let s = 0; s < segs; s++) {
        const blade = new THREE.Mesh(
            new THREE.PlaneGeometry(0.3 + Math.random() * 0.2, h / segs),
            new THREE.MeshStandardMaterial({
                color: new THREE.Color().setHSL(0.28 + Math.random() * 0.06, 0.5, 0.12),
                side: THREE.DoubleSide, transparent: true, opacity: 0.8,
            })
        );
        blade.position.y = s * (h / segs) + h / segs / 2;
        blade.rotation.y = Math.random() * Math.PI;
        blade.userData = { i: s, ph: Math.random() * 6.28 };
        kelpGroup.add(blade);
    }
    kelpGroup.position.set(
        (Math.random() - 0.5) * WORLD_SIZE,
        -MAX_DEPTH,
        (Math.random() - 0.5) * WORLD_SIZE
    );
    kelpGroup.userData = { type: 'kelp' };
    scene.add(kelpGroup);
}

// Hydrothermal vents (2-3, with particle columns but NO extra lights)
for (let i = 0; i < 3; i++) {
    const vx = (Math.random() - 0.5) * 180, vz = (Math.random() - 0.5) * 180;
    // Chimney
    const chimney = new THREE.Mesh(
        new THREE.CylinderGeometry(0.6, 1.8, 8, 8),
        new THREE.MeshStandardMaterial({ color: 0x1a0a00, roughness: 1, emissive: 0x331100, emissiveIntensity: 0.4 })
    );
    chimney.position.set(vx, -MAX_DEPTH + 4, vz);
    scene.add(chimney);

    // Smoke particles
    const smokeCount = 60;
    const smokeGeo = new THREE.BufferGeometry();
    const sPos = new Float32Array(smokeCount * 3);
    for (let j = 0; j < smokeCount; j++) {
        sPos[j * 3] = vx + (Math.random() - 0.5) * 2;
        sPos[j * 3 + 1] = -MAX_DEPTH + 8 + Math.random() * 12;
        sPos[j * 3 + 2] = vz + (Math.random() - 0.5) * 2;
    }
    smokeGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
    const smoke = new THREE.Points(smokeGeo, new THREE.PointsMaterial({
        color: 0xff6622, size: 0.6, transparent: true, opacity: 0.2,
        blending: THREE.AdditiveBlending, depthWrite: false,
    }));
    smoke.userData = { type: 'smoke', baseX: vx, baseZ: vz };
    scene.add(smoke);
}

// ─ Jellyfish (beautiful, translucent) ─
function makeJelly(deep) {
    const g = new THREE.Group();
    const size = deep ? 2 + Math.random() * 1.5 : 0.8 + Math.random() * 1.2;
    const hue = deep ? 0.78 + Math.random() * 0.12 : 0.47 + Math.random() * 0.13;
    const color = new THREE.Color().setHSL(hue, 0.9, 0.55);

    // Bell
    const bellGeo = new THREE.SphereGeometry(size, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.55);
    const bellMat = new THREE.MeshStandardMaterial({
        color, emissive: color, emissiveIntensity: deep ? 0.7 : 0.4,
        transparent: true, opacity: 0.5, side: THREE.DoubleSide, roughness: 0.1, metalness: 0,
        depthWrite: false,
    });
    const bell = new THREE.Mesh(bellGeo, bellMat);
    bell.rotation.x = Math.PI;
    g.add(bell);

    // Inner glow
    const innerGeo = new THREE.SphereGeometry(size * 0.5, 10, 8);
    const innerMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color().setHSL(hue, 1, 0.7),
        transparent: true, opacity: 0.35, depthWrite: false,
    });
    const inner = new THREE.Mesh(innerGeo, innerMat);
    inner.position.y = size * 0.15;
    inner.scale.y = 0.5;
    g.add(inner);

    // Tentacles (curves)
    const tentCount = 8 + Math.floor(Math.random() * 8);
    for (let i = 0; i < tentCount; i++) {
        const tentLen = size * (1.5 + Math.random() * 3);
        const tentGeo = new THREE.CylinderGeometry(0.01 * size, 0.004 * size, tentLen, 3);
        const tentMat = new THREE.MeshBasicMaterial({
            color, transparent: true, opacity: 0.3, depthWrite: false,
        });
        const tent = new THREE.Mesh(tentGeo, tentMat);
        const angle = (i / tentCount) * Math.PI * 2;
        const r = size * 0.5;
        tent.position.set(Math.cos(angle) * r, tentLen / 2 + size * 0.3, Math.sin(angle) * r);
        tent.userData = { ph: Math.random() * 6.28, angle };
        g.add(tent);
    }

    g.userData = { type: deep ? 'deepjelly' : 'jellyfish', speed: 0.1 + Math.random() * 0.2, ph: Math.random() * 6.28, size };
    return g;
}

// ─ Anglerfish ─
function makeAngler() {
    const g = new THREE.Group();
    const bodyGeo = new THREE.SphereGeometry(1.2, 12, 10);
    const arr = bodyGeo.attributes.position.array;
    for (let i = 0; i < arr.length; i += 3) { if (arr[i] > 0) arr[i] *= 1.4; }
    bodyGeo.computeVertexNormals();
    const body = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({ color: 0x0a0500, roughness: 1 }));
    g.add(body);

    // Lure
    const lure = new THREE.Mesh(
        new THREE.SphereGeometry(0.2, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0x80ffb0 })
    );
    lure.position.set(1.2, 2.2, 0);
    g.add(lure);
    // Lure stalk
    const stalk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.015, 0.015, 2, 4),
        new THREE.MeshBasicMaterial({ color: 0x222222 })
    );
    stalk.position.set(0.6, 1.5, 0);
    stalk.rotation.z = -0.4;
    g.add(stalk);

    // Lure glow (single point light - only creature with a light)
    const lureLight = new THREE.PointLight(0x80ffb0, 6, 20);
    lureLight.position.copy(lure.position);
    g.add(lureLight);

    // Teeth
    for (let i = 0; i < 12; i++) {
        const tooth = new THREE.Mesh(
            new THREE.ConeGeometry(0.025, 0.15 + Math.random() * 0.15, 3),
            new THREE.MeshBasicMaterial({ color: 0xccccaa })
        );
        const a = (i / 12) * Math.PI * 2;
        tooth.position.set(1.4 + Math.cos(a) * 0.15, Math.sin(a) * 0.5 - 0.2, Math.cos(a) * 0.4);
        tooth.lookAt(1.4, -0.2, 0);
        g.add(tooth);
    }

    // Eyes
    for (const z of [0.5, -0.5]) {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 6), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
        eye.position.set(0.9, 0.4, z);
        g.add(eye);
    }

    g.userData = { type: 'anglerfish', speed: 0.05 + Math.random() * 0.05, ph: Math.random() * 6.28, wanderAngle: Math.random() * 6.28, lureLight };
    g.scale.setScalar(1.4);
    return g;
}

// ─ Manta Ray ─
function makeManta() {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: 0x1a1a35, roughness: 0.45, metalness: 0.4, side: THREE.DoubleSide });

    // Body
    const bodyGeo = new THREE.SphereGeometry(1, 14, 8);
    bodyGeo.scale(1.5, 0.15, 1);
    g.add(new THREE.Mesh(bodyGeo, mat));

    // Wings
    for (const side of [-1, 1]) {
        const wingGeo = new THREE.PlaneGeometry(5, 2.5, 8, 4);
        const wp = wingGeo.attributes.position.array;
        for (let i = 0; i < wp.length; i += 3) {
            const dist = Math.abs(wp[i + 1]) / 1.25;
            wp[i] *= (1 - dist * 0.4);
            wp[i + 2] = Math.pow(dist, 1.3) * 0.4 * side;
        }
        wingGeo.computeVertexNormals();
        const wing = new THREE.Mesh(wingGeo, mat);
        wing.position.z = side * 1.5;
        wing.userData = { side };
        g.add(wing);
    }

    // Tail
    const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.01, 5, 4), mat);
    tail.position.set(-3, 0, 0);
    tail.rotation.z = Math.PI / 2;
    g.add(tail);

    // Belly
    const belly = new THREE.Mesh(
        new THREE.SphereGeometry(0.9, 10, 6),
        new THREE.MeshStandardMaterial({ color: 0xccccdd, roughness: 0.5 })
    );
    belly.scale.set(1.3, 0.12, 0.9);
    belly.position.y = -0.08;
    g.add(belly);

    g.userData = { type: 'manta', speed: 0.15 + Math.random() * 0.1, ph: Math.random() * 6.28, wanderAngle: Math.random() * 6.28 };
    g.scale.setScalar(2.2);
    return g;
}

// ─ Oarfish (serpentine) ─
function makeOarfish() {
    const g = new THREE.Group();
    const segCount = 30;
    const mat = new THREE.MeshStandardMaterial({ color: 0x6688aa, metalness: 0.4, roughness: 0.3 });

    for (let i = 0; i < segCount; i++) {
        const t = i / segCount;
        const r = 0.2 * (1 - t * 0.6);
        const seg = new THREE.Mesh(new THREE.SphereGeometry(r, 5, 4), mat);
        seg.scale.x = 2;
        seg.position.x = i * 0.6;
        seg.userData = { idx: i };

        // Red dorsal crest on front half
        if (i < segCount * 0.4) {
            const crest = new THREE.Mesh(
                new THREE.PlaneGeometry(0.5, 0.4 * (1 - t * 2)),
                new THREE.MeshStandardMaterial({ color: 0xff2200, emissive: 0xff3300, emissiveIntensity: 0.3, side: THREE.DoubleSide })
            );
            crest.position.y = r + 0.15;
            seg.add(crest);
        }
        g.add(seg);
    }

    g.userData = { type: 'oarfish', speed: 0.1 + Math.random() * 0.08, ph: Math.random() * 6.28, wanderAngle: Math.random() * 6.28 };
    g.scale.setScalar(1.8);
    return g;
}

// ─ Giant Squid ─
function makeSquid() {
    const g = new THREE.Group();
    const col = new THREE.Color().setHSL(0.95, 0.6, 0.22);
    const mat = new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.15, roughness: 0.5, metalness: 0.2 });

    // Mantle
    const mantle = new THREE.Mesh(new THREE.CapsuleGeometry(0.8, 3.5, 10, 14), mat);
    mantle.rotation.z = Math.PI / 2;
    mantle.position.x = -1;
    g.add(mantle);

    // Head
    const head = new THREE.Mesh(new THREE.SphereGeometry(1.1, 10, 8), mat);
    head.position.x = 2;
    head.scale.z = 0.8;
    g.add(head);

    // Eyes (huge)
    for (const z of [0.8, -0.8]) {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffdd00 }));
        eye.position.set(2.5, 0, z);
        g.add(eye);
    }

    // Tentacles (simple curves)
    for (let i = 0; i < 8; i++) {
        const segs = 8;
        const len = i < 2 ? 8 : 4;
        for (let s = 0; s < segs; s++) {
            const t = s / segs;
            const thickness = 0.12 * (1 - t * 0.7);
            const seg = new THREE.Mesh(new THREE.SphereGeometry(thickness, 4, 3), mat);
            seg.scale.x = 2;
            const angle = (i / 8) * Math.PI * 2;
            seg.position.set(3 + s * (len / segs), Math.sin(angle) * 0.5, Math.cos(angle) * 0.5);
            seg.userData = { tentIdx: i, segIdx: s, ph: i * 0.8 + s * 0.3 };
            g.add(seg);
        }
    }

    g.userData = { type: 'squid', speed: 0.08 + Math.random() * 0.08, ph: Math.random() * 6.28, wanderAngle: Math.random() * 6.28 };
    g.scale.setScalar(1.5);
    return g;
}

// ─── DEPTH ZONES ─────────────────────────────────────────
const zones = [
    { name: 'SUNLIGHT ZONE', min: 0, max: 25, fog: 0.005, bgL: 0.14 },
    { name: 'TWILIGHT ZONE', min: 25, max: 55, fog: 0.008, bgL: 0.06 },
    { name: 'MIDNIGHT ZONE', min: 55, max: 85, fog: 0.013, bgL: 0.02 },
    { name: 'ABYSSAL ZONE', min: 85, max: 200, fog: 0.018, bgL: 0.006 },
];
let curZone = '';

// ─── ANIMATION LOOP ──────────────────────────────────────
function animate(time) {
    requestAnimationFrame(animate);
    const t = time * 0.001;

    // ── Sub controls ──
    const max = keys['shift'] ? physics.boost : physics.maxSpeed;
    if (keys['w']) physics.speed = Math.min(physics.speed + physics.accel, max);
    else if (keys['s']) physics.speed = Math.max(physics.speed - physics.accel, -max * 0.35);
    else physics.speed *= physics.drag;

    if (keys['a']) { sub.rotation.y += physics.turnRate; physics.roll = Math.max(physics.roll - 0.008, -0.12); }
    else if (keys['d']) { sub.rotation.y -= physics.turnRate; physics.roll = Math.min(physics.roll + 0.008, 0.12); }
    else physics.roll *= 0.93;

    if (keys['q']) sub.position.y = Math.min(sub.position.y + 0.07, -1);
    if (keys['e']) sub.position.y = Math.max(sub.position.y - 0.07, -MAX_DEPTH + 5);

    // Mouse look (smooth)
    sub.rotation.y += (mouseX * -1 - sub.rotation.y) * 0.025;
    sub.rotation.x += (mouseY * 0.25 - sub.rotation.x) * 0.025;
    sub.rotation.z = physics.roll;

    // Move
    const fwd = new THREE.Vector3(1, 0, 0).applyQuaternion(sub.quaternion);
    sub.position.add(fwd.multiplyScalar(physics.speed));

    // Prop spin
    propGroup.rotation.x += physics.speed * 18;

    // ── Camera (smooth cinematic follow) ──
    const camBack = new THREE.Vector3(-7, 2.8, 1.5).applyQuaternion(sub.quaternion);
    camera.position.lerp(sub.position.clone().add(camBack), 0.04);
    const lookAt = sub.position.clone().add(new THREE.Vector3(5, 0, 0).applyQuaternion(sub.quaternion));
    camera.lookAt(lookAt);

    // ── Lights ──
    headlamp.position.copy(sub.position).add(new THREE.Vector3(2.3, 0.2, 0).applyQuaternion(sub.quaternion));
    headlamp.target.position.copy(sub.position).add(new THREE.Vector3(30, -2, 0).applyQuaternion(sub.quaternion));
    fillLight.position.copy(sub.position).add(new THREE.Vector3(0, 1, 0));
    backFill.position.copy(sub.position).add(new THREE.Vector3(-4, 1.5, 0).applyQuaternion(sub.quaternion));

    // ── Depth / atmosphere ──
    const depth = Math.max(0, -sub.position.y);
    const depthN = Math.min(1, depth / MAX_DEPTH);
    const zone = zones.find(z => depth >= z.min && depth < z.max) || zones[3];

    scene.fog.density = zone.fog;
    scene.background.setHSL(0.58, 0.35, zone.bgL);
    colorGrade.uniforms.depth.value = depthN;
    bloom.strength = 0.5 + depthN * 0.7;

    // God rays fade with depth
    rayGroup.children.forEach(r => { r.material.opacity = Math.max(0, 0.035 * (1 - depthN * 1.5)); });

    // Sun light fades
    sunDir.intensity = Math.max(0.2, 2.0 - depthN * 1.8);
    ambient.intensity = Math.max(0.4, 2.0 - depthN * 1.5);

    // Zone announcement
    if (zone.name !== curZone) {
        curZone = zone.name;
        const el = document.getElementById('zone-announce');
        el.textContent = zone.name;
        el.style.opacity = '1';
        setTimeout(() => { el.style.opacity = '0'; }, 3000);
        document.getElementById('zone-display').textContent = zone.name;
    }

    // ── Particles ──
    const sp = snow.geometry.attributes.position.array;
    for (let i = 0; i < snowCount * 3; i += 3) {
        sp[i + 1] -= 0.008;
        sp[i] += Math.sin(t * 0.3 + i * 0.01) * 0.002;
        if (sp[i + 1] < -MAX_DEPTH) sp[i + 1] = 10;
    }
    snow.geometry.attributes.position.needsUpdate = true;

    // Kelp sway
    scene.traverse(obj => {
        if (obj.userData && obj.userData.i !== undefined && obj.parent && obj.parent.userData.type === 'kelp') {
            const intensity = obj.userData.i * 0.04;
            obj.rotation.x = Math.sin(t * 0.6 + obj.userData.ph + obj.userData.i * 0.4) * intensity;
        }
    });

    // Vent smoke
    scene.traverse(obj => {
        if (obj.userData && obj.userData.type === 'smoke') {
            const p = obj.geometry.attributes.position.array;
            for (let i = 0; i < p.length; i += 3) {
                p[i + 1] += 0.04;
                p[i] += (Math.random() - 0.5) * 0.04;
                p[i + 2] += (Math.random() - 0.5) * 0.04;
                if (p[i + 1] > -MAX_DEPTH + 25) {
                    p[i] = obj.userData.baseX + (Math.random() - 0.5) * 1.5;
                    p[i + 1] = -MAX_DEPTH + 8;
                    p[i + 2] = obj.userData.baseZ + (Math.random() - 0.5) * 1.5;
                }
            }
            obj.geometry.attributes.position.needsUpdate = true;
        }
    });

    // ── Creature animation ──
    creatures.forEach(c => {
        const d = c.userData;
        if (d.wanderAngle !== undefined) {
            d.wanderAngle += (Math.random() - 0.5) * 0.008;
            c.position.x += Math.cos(d.wanderAngle) * d.speed * 0.12;
            c.position.z += Math.sin(d.wanderAngle) * d.speed * 0.12;
        }

        switch (d.type) {
            case 'jellyfish': case 'deepjelly':
                c.position.y += Math.sin(t * d.speed * 2.5 + d.ph) * 0.012;
                // Bell pulse
                const pulse = Math.sin(t * d.speed * 4 + d.ph);
                c.children[0].scale.set(0.9 + pulse * 0.1, 1 + pulse * 0.08, 0.9 + pulse * 0.1);
                // Tentacles
                c.children.forEach(ch => {
                    if (ch.userData.ph !== undefined) {
                        ch.rotation.x = Math.sin(t * 1.2 + ch.userData.ph) * 0.15;
                        ch.rotation.z = Math.cos(t * 0.8 + ch.userData.ph) * 0.08;
                    }
                });
                c.rotation.y += 0.001;
                break;
            case 'anglerfish':
                c.position.y += Math.sin(t * 0.4 + d.ph) * 0.004;
                c.rotation.y = -d.wanderAngle + Math.PI / 2;
                if (d.lureLight) d.lureLight.intensity = 4 + Math.sin(t * 5 + d.ph) * 2 + Math.random() * 2;
                break;
            case 'manta':
                c.position.y += Math.sin(t * 0.35 + d.ph) * 0.012;
                c.rotation.y = -d.wanderAngle + Math.PI / 2;
                c.children.forEach(ch => {
                    if (ch.userData.side) ch.rotation.x = Math.sin(t * 1.0 + d.ph) * 0.18 * ch.userData.side;
                });
                break;
            case 'whale':
                c.position.y += Math.sin(t * 0.2 + d.ph) * 0.015;
                c.rotation.y = -d.wanderAngle + Math.PI / 2;
                if (d.fluke) d.fluke.rotation.z = Math.sin(t * 0.6) * 0.25;
                break;
            case 'turtle':
                c.position.y += Math.sin(t * 0.3 + d.ph) * 0.008;
                c.rotation.y = -d.wanderAngle + Math.PI / 2;
                if (d.flippers) {
                    d.flippers[0].rotation.z = Math.sin(t * 1.3 + d.ph) * 0.45;
                    d.flippers[1].rotation.z = Math.sin(t * 1.3 + d.ph + Math.PI) * 0.45;
                    d.flippers[2].rotation.z = Math.sin(t + d.ph) * 0.25;
                    d.flippers[3].rotation.z = Math.sin(t + d.ph + Math.PI) * 0.25;
                }
                break;
            case 'school':
                c.children.forEach(fish => {
                    if (fish.userData.offset) {
                        const fd = fish.userData;
                        fish.position.x = fd.offset.x + Math.sin(t * fd.spd + fd.ph) * 1.5;
                        fish.position.y = fd.offset.y + Math.cos(t * fd.spd * 0.7 + fd.ph) * 0.8;
                        fish.position.z = fd.offset.z + Math.sin(t * fd.spd * 0.5 + fd.ph + 1) * 1.5;
                    }
                });
                break;
            case 'oarfish':
                c.rotation.y = -d.wanderAngle + Math.PI / 2;
                c.children.forEach(seg => {
                    if (seg.userData.idx !== undefined) {
                        seg.position.y = Math.sin(t * 1.8 + seg.userData.idx * 0.5) * 0.3;
                        seg.position.z = Math.cos(t * 1.3 + seg.userData.idx * 0.4) * 0.2;
                    }
                });
                break;
            case 'dragonfish':
                c.rotation.y = -d.wanderAngle + Math.PI / 2;
                break;
            case 'squid':
                c.position.y += Math.sin(t * 0.3 + d.ph) * 0.015;
                c.rotation.y = -d.wanderAngle + Math.PI / 2;
                // Tentacle wave
                c.children.forEach(seg => {
                    if (seg.userData.tentIdx !== undefined) {
                        seg.position.y += Math.sin(t * 1.5 + seg.userData.ph) * 0.003;
                    }
                });
                break;
        }

        // Wrap
        const W = WORLD_SIZE * 0.6;
        if (c.position.x > W) c.position.x -= W * 2;
        if (c.position.x < -W) c.position.x += W * 2;
        if (c.position.z > W) c.position.z -= W * 2;
        if (c.position.z < -W) c.position.z += W * 2;
    });

    // ── Creature detection ──
    let nearestDist = 25, nearest = null;
    creatures.forEach(c => {
        const dist = sub.position.distanceTo(c.position);
        if (dist < nearestDist) { nearestDist = dist; nearest = c; }
    });
    const toast = document.getElementById('creature-toast');
    if (nearest && creatureDB[nearest.userData.type]) {
        const info = creatureDB[nearest.userData.type];
        spotted.add(nearest.userData.type);
        toast.innerHTML = `<strong>${info.name}</strong> · <em>${info.latin}</em><br>${info.note}`;
        toast.classList.add('visible');
    } else {
        toast.classList.remove('visible');
    }

    // ── HUD ──
    document.getElementById('hud-depth').textContent = Math.round(depth) + ' m';
    document.getElementById('hud-speed').textContent = (Math.abs(physics.speed) * 50).toFixed(1) + ' kn';
    document.getElementById('hud-bearing').textContent = (((sub.rotation.y * 180 / Math.PI) % 360 + 360) % 360).toFixed(0).padStart(3, '0') + '°';
    document.getElementById('hud-species').textContent = spotted.size + ' / ' + Object.keys(creatureDB).length;
    document.getElementById('depth-bar-fill').style.height = (depthN * 100) + '%';
    const markerY = 50 + (depthN - 0.5) * 100 * (160 / window.innerHeight);
    document.getElementById('depth-label').style.top = `calc(${50 + (depthN - 0.5) * 21}%)`;
    document.getElementById('depth-label').textContent = Math.round(depth) + 'm';

    // Render
    composer.render();
}

// ─── START ────────────────────────────────────────────────
setTimeout(() => {
    document.getElementById('loading').style.opacity = '0';
    setTimeout(() => document.getElementById('loading').remove(), 2500);
    requestAnimationFrame(animate);
}, 2000);

// Fade controls hint
setTimeout(() => { document.getElementById('controls-hint').style.opacity = '0'; }, 12000);

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
