        // Kelp forests
        function createKelpForest(x, z) {
            const count = 15 + Math.floor(Math.random() * 20);
            for (let i = 0; i < count; i++) {
                const kelpGroup = new THREE.Group();
                const height = 10 + Math.random() * 20;
                const segments = Math.floor(height / 1.5);
                const hue = 0.25 + Math.random() * 0.1;

                for (let s = 0; s < segments; s++) {
                    const segGeom = new THREE.PlaneGeometry(0.4 + Math.random() * 0.3, height / segments);
                    const segMat = new THREE.MeshStandardMaterial({
                        color: new THREE.Color().setHSL(hue, 0.6, 0.15 + s / segments * 0.1),
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.85,
                    });
                    const seg = new THREE.Mesh(segGeom, segMat);
                    seg.position.y = s * (height / segments);
                    seg.rotation.y = Math.random() * Math.PI;
                    seg.userData = { segIndex: s, phase: Math.random() * Math.PI * 2 };
                    kelpGroup.add(seg);
                }

                kelpGroup.position.set(
                    x + (Math.random() - 0.5) * 15,
                    -98,
                    z + (Math.random() - 0.5) * 15
                );
                kelpGroup.userData = { type: 'kelp' };
                scene.add(kelpGroup);
            }
        }

        // Create several kelp forests
        createKelpForest(-40, -30);
        createKelpForest(50, 40);
        createKelpForest(-60, 60);
        createKelpForest(30, -70);

        // Hydrothermal vents (dramatic)
        function createVent(x, z) {
            const group = new THREE.Group();

            // Chimney stack
            const chimneyGeom = new THREE.CylinderGeometry(0.8, 2.5, 10, 10);
            const chimneyPos = chimneyGeom.attributes.position.array;
            for (let i = 0; i < chimneyPos.length; i += 3) {
                chimneyPos[i] += (Math.random() - 0.5) * 0.5;
                chimneyPos[i + 2] += (Math.random() - 0.5) * 0.5;
            }
            chimneyGeom.computeVertexNormals();
            const chimneyMat = new THREE.MeshStandardMaterial({
                color: 0x2a1a0a,
                roughness: 1,
            });
            const chimney = new THREE.Mesh(chimneyGeom, chimneyMat);
            chimney.position.y = 5;
            group.add(chimney);

            // Black smoker particles
            const smokeCount = 200;
            const smokeGeom = new THREE.BufferGeometry();
            const smokePositions = new Float32Array(smokeCount * 3);
            for (let i = 0; i < smokeCount; i++) {
                smokePositions[i * 3] = (Math.random() - 0.5) * 2;
                smokePositions[i * 3 + 1] = 10 + Math.random() * 15;
                smokePositions[i * 3 + 2] = (Math.random() - 0.5) * 2;
            }
            smokeGeom.setAttribute('position', new THREE.BufferAttribute(smokePositions, 3));
            const smokeMat = new THREE.PointsMaterial({
                color: 0x442200,
                size: 0.8,
                transparent: true,
                opacity: 0.4,
                blending: THREE.AdditiveBlending,
            });
            const smoke = new THREE.Points(smokeGeom, smokeMat);
            group.add(smoke);

            // Intense heat glow
            const heatGlow = new THREE.PointLight(0xff4400, 15, 30);
            heatGlow.position.y = 10;
            group.add(heatGlow);

            const heatGlow2 = new THREE.PointLight(0xff8800, 8, 20);
            heatGlow2.position.y = 12;
            group.add(heatGlow2);

            // Mineral deposits
            for (let i = 0; i < 5; i++) {
                const mineralGeom = new THREE.DodecahedronGeometry(0.5 + Math.random() * 1, 1);
                const mineralMat = new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL(0.08, 0.8, 0.2 + Math.random() * 0.1),
                    metalness: 0.5,
                    roughness: 0.5,
                    emissive: 0x331100,
                    emissiveIntensity: 0.3,
                });
                const mineral = new THREE.Mesh(mineralGeom, mineralMat);
                mineral.position.set(
                    (Math.random() - 0.5) * 4,
                    Math.random() * 3,
                    (Math.random() - 0.5) * 4
                );
                group.add(mineral);
            }

            group.position.set(x, -98, z);
            group.userData = { type: 'vent', smoke, smokePositions };
            scene.add(group);
        }

        createVent(30, -50);
        createVent(-45, 30);
        createVent(70, 60);
        createVent(-80, -40);

        // Bubble columns from vents
        function createBubbleColumn(x, z) {
            const geom = new THREE.BufferGeometry();
            const count = 80;
            const positions = new Float32Array(count * 3);
            const speeds = [];
            for (let i = 0; i < count; i++) {
                positions[i * 3] = x + (Math.random() - 0.5) * 3;
                positions[i * 3 + 1] = -98 + Math.random() * 40;
                positions[i * 3 + 2] = z + (Math.random() - 0.5) * 3;
                speeds.push(0.05 + Math.random() * 0.1);
            }
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({
                color: 0x88ddff,
                size: 0.3,
                transparent: true,
                opacity: 0.5,
                blending: THREE.AdditiveBlending,
            });
            const bubbles = new THREE.Points(geom, mat);
            bubbles.userData = { type: 'bubbleColumn', speeds, baseX: x, baseZ: z };
            scene.add(bubbles);
        }

        createBubbleColumn(30, -50);
        createBubbleColumn(-45, 30);
        createBubbleColumn(70, 60);

        // === DEPTH ZONES ===
        const depthZones = [
            { name: 'SUNLIGHT ZONE', minDepth: 0, maxDepth: 20, bgHue: 0.58, bgLum: 0.08, fogDensity: 0.004 },
            { name: 'TWILIGHT ZONE', minDepth: 20, maxDepth: 45, bgHue: 0.6, bgLum: 0.03, fogDensity: 0.006 },
            { name: 'MIDNIGHT ZONE', minDepth: 45, maxDepth: 70, bgHue: 0.65, bgLum: 0.01, fogDensity: 0.008 },
            { name: 'ABYSSAL ZONE', minDepth: 70, maxDepth: 100, bgHue: 0.7, bgLum: 0.005, fogDensity: 0.012 },
        ];
        let currentZone = '';

        function getDepthZone(depth) {
            for (const zone of depthZones) {
                if (depth >= zone.minDepth && depth < zone.maxDepth) return zone;
            }
            return depthZones[depthZones.length - 1];
        }

        // === ANIMATION ===
        const clock = new THREE.Clock();
        let lastCreatureCheck = 0;

        function animateCreatures(time) {
            const t = time * 0.001;
            creatures.forEach(creature => {
                const data = creature.userData;

                // Common wandering behavior
                if (data.wanderAngle !== undefined) {
                    data.wanderAngle += (Math.random() - 0.5) * 0.01;
                    creature.position.x += Math.cos(data.wanderAngle) * data.speed * 0.15;
                    creature.position.z += Math.sin(data.wanderAngle) * data.speed * 0.15;
                    creature.rotation.y = -data.wanderAngle + Math.PI / 2;
                }

                // Type-specific animations
                switch (data.type) {
                    case 'jellyfish':
                    case 'crown_jelly': {
                        // Pulsing bell
                        const pulse = Math.sin(t * data.speed * 4 + data.bobPhase);
                        creature.position.y += Math.sin(t * data.speed * 2 + data.bobPhase) * 0.015;
                        const bellScale = 0.85 + pulse * 0.15;
                        creature.children[0].scale.set(bellScale, 1 + pulse * 0.1, bellScale);

                        // Glow intensity variation
                        if (data.glow) {
                            data.glow.intensity = (data.type === 'crown_jelly' ? 6 : 2) + Math.sin(t * 3 + data.bobPhase) * 2;
                        }

                        // Tentacle sway
                        creature.children.forEach((child, i) => {
                            if (i > 2 && child.userData.phase !== undefined) {
                                child.rotation.x = Math.sin(t * 1.5 + child.userData.phase) * 0.2;
                                child.rotation.z = Math.cos(t * 1.2 + child.userData.phase) * 0.1;
                            }
                        });
                        break;
                    }
                    case 'anglerfish': {
                        creature.position.y += Math.sin(t * 0.5 + data.phase) * 0.005;
                        if (data.lureGlow) {
                            data.lureGlow.intensity = 10 + Math.sin(t * 6 + data.phase) * 5 + Math.random() * 5;
                        }
                        break;
                    }
                    case 'giant_squid': {
                        creature.position.y += Math.sin(t * 0.3 + data.phase) * 0.02;

                        // Animate tentacles
                        creature.children.forEach(child => {
                            if (child.userData && child.userData.phase !== undefined && child.children) {
                                child.children.forEach(seg => {
                                    if (seg.userData && seg.userData.idx !== undefined) {
                                        const wave = Math.sin(t * 2 + seg.userData.phase + seg.userData.idx * 0.4);
                                        seg.position.y = wave * 0.3 * (seg.userData.idx / 16);
                                        seg.position.z = Math.cos(t * 1.5 + seg.userData.phase + seg.userData.idx * 0.3) * 0.2;
                                    }
                                });
                            }
                        });
                        break;
                    }
                    case 'lanternfish': {
                        creature.children.forEach(fish => {
                            if (fish.userData && fish.userData.offset) {
                                const fd = fish.userData;
                                const wobble = Math.sin(t * fd.speed + fd.phase);
                                fish.position.x = fd.offset.x + wobble * 2;
                                fish.position.y = fd.offset.y + Math.cos(t * fd.speed * 0.7 + fd.phase) * 1;
                                fish.position.z = fd.offset.z + Math.sin(t * fd.speed * 0.5 + fd.phase + 1) * 2;
                            }
                        });
                        break;
                    }
                    case 'manta_ray': {
                        creature.position.y += Math.sin(t * 0.4 + data.phase) * 0.015;
                        // Wing flap
                        creature.children.forEach(child => {
                            if (child.userData && child.userData.side !== undefined) {
                                child.rotation.x = child.userData.baseRot + Math.sin(t * 1.2 + data.phase) * 0.2 * child.userData.side;
                            }
                        });
                        break;
                    }
                    case 'whale': {
                        creature.position.y += Math.sin(t * 0.2 + data.phase) * 0.02;
                        if (data.fluke) {
                            data.fluke.rotation.z = Math.sin(t * 0.8 + data.phase) * 0.3;
                        }
                        break;
                    }
                    case 'dragonfish': {
                        if (data.barbelGlow) {
                            data.barbelGlow.intensity = 5 + Math.sin(t * 4 + data.phase) * 3 + Math.random() * 2;
                        }
                        break;
                    }
                    case 'sea_turtle': {
                        creature.position.y += Math.sin(t * 0.3 + data.phase) * 0.01;
                        if (data.flippers) {
                            data.flippers[0].rotation.z = Math.sin(t * 1.5 + data.phase) * 0.5;
                            data.flippers[1].rotation.z = Math.sin(t * 1.5 + data.phase + Math.PI) * 0.5;
                            data.flippers[2].rotation.z = Math.sin(t * 1.2 + data.phase) * 0.3;
                            data.flippers[3].rotation.z = Math.sin(t * 1.2 + data.phase + Math.PI) * 0.3;
                        }
                        break;
                    }
                    case 'nautilus': {
                        creature.position.y += Math.sin(t * 0.5 + data.phase) * 0.01;
                        creature.rotation.z = Math.sin(t * 0.3 + data.phase) * 0.1;
                        break;
                    }
                    case 'oarfish': {
                        // Serpentine motion
                        creature.children.forEach(child => {
                            if (child.userData && child.userData.idx !== undefined) {
                                const wave = Math.sin(t * 2 + child.userData.phase + child.userData.idx * 0.4);
                                child.position.y = wave * 0.5;
                                child.position.z = Math.cos(t * 1.5 + child.userData.idx * 0.3) * 0.3;
                            }
                        });
                        break;
                    }
                    case 'cuttlefish': {
                        creature.position.y += Math.sin(t * 0.6 + data.phase) * 0.008;
                        // Color-shifting chromatophores
                        creature.children.forEach(child => {
                            if (child.userData && child.userData.huePhase !== undefined) {
                                const hue = (t * 0.1 + child.userData.huePhase) % 1;
                                child.material.color.setHSL(hue, 1, 0.5);
                            }
                        });
                        break;
                    }
                }

                // World wrapping
                const wrapDist = 160;
                if (creature.position.x > wrapDist) creature.position.x -= wrapDist * 2;
                if (creature.position.x < -wrapDist) creature.position.x += wrapDist * 2;
                if (creature.position.z > wrapDist) creature.position.z -= wrapDist * 2;
                if (creature.position.z < -wrapDist) creature.position.z += wrapDist * 2;
            });
        }

        function checkCreatureProximity() {
            let closest = null;
            let closestDist = 35;

            creatures.forEach(creature => {
                const dist = submarine.position.distanceTo(creature.position);
                if (dist < closestDist) {
                    closestDist = dist;
                    closest = creature;
                }
            });

            const infoEl = document.getElementById('creature-info');
            if (closest && closest.userData.type) {
                const info = creatureDatabase[closest.userData.type];
                if (info) {
                    infoEl.innerHTML = `<strong>${info.name}</strong><br><em>${info.latin}</em><br>${info.desc}`;
                    infoEl.style.opacity = Math.max(0.4, 1 - closestDist / 35);
                    creaturesSpotted.add(closest.userData.type);
                }
            } else {
                infoEl.style.opacity = '0';
            }
        }

        // Main loop
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = clock.getDelta();

            // === SUBMARINE CONTROLS ===
            const maxSpeed = keys['shift'] ? subState.boostMaxSpeed : subState.maxSpeed;

            if (keys['w']) subState.speed = Math.min(subState.speed + subState.acceleration, maxSpeed);
            else if (keys['s']) subState.speed = Math.max(subState.speed - subState.acceleration, -maxSpeed * 0.4);
            else subState.speed *= subState.deceleration;

            if (keys['a']) {
                submarine.rotation.y += subState.turnSpeed;
                subState.roll = Math.max(subState.roll - 0.01, -0.15);
            } else if (keys['d']) {
                submarine.rotation.y -= subState.turnSpeed;
                subState.roll = Math.min(subState.roll + 0.01, 0.15);
            } else {
                subState.roll *= 0.95;
            }

            if (keys['q']) submarine.position.y = Math.min(submarine.position.y + 0.08, -2);
            if (keys['e']) submarine.position.y = Math.max(submarine.position.y - 0.08, -95);

            // Apply mouse look
            submarine.rotation.y += (mouseX * -1 - submarine.rotation.y) * 0.03;
            submarine.rotation.x += (mouseY * 0.3 - submarine.rotation.x) * 0.03;
            submarine.rotation.z = subState.roll;

            // Move submarine
            const forward = new THREE.Vector3(1, 0, 0);
            forward.applyQuaternion(submarine.quaternion);
            submarine.position.add(forward.multiplyScalar(subState.speed));

            // Propeller
            propGroup.rotation.x += subState.speed * 15;

            // === CAMERA ===
            const camOffset = new THREE.Vector3(-10, 3, 0);
            camOffset.applyQuaternion(submarine.quaternion);
            const targetCamPos = submarine.position.clone().add(camOffset);
            camera.position.lerp(targetCamPos, 0.04);

            const lookTarget = submarine.position.clone();
            const lookAhead = new THREE.Vector3(6, 0, 0);
            lookAhead.applyQuaternion(submarine.quaternion);
            lookTarget.add(lookAhead);
            camera.lookAt(lookTarget);

            // Lights follow submarine
            subSpotlight.position.copy(submarine.position);
            subSpotlight.position.add(new THREE.Vector3(3, 0.3, 0).applyQuaternion(submarine.quaternion));
            const spotTarget = submarine.position.clone().add(new THREE.Vector3(30, -2, 0).applyQuaternion(submarine.quaternion));
            subSpotlight.target.position.copy(spotTarget);
            subFillLight.position.copy(submarine.position);

            floodlight.position.copy(subSpotlight.position);
            floodlight.target.position.copy(spotTarget);

            // === DEPTH/ENVIRONMENT ===
            const depth = Math.max(0, -submarine.position.y);
            const zone = getDepthZone(depth);
            const depthNorm = Math.min(1, depth / 95);

            // Update fog + bg
            scene.fog.density = zone.fogDensity;
            scene.background = new THREE.Color().setHSL(zone.bgHue, 0.4, zone.bgLum);

            // God rays fade with depth
            godRays.children.forEach(ray => {
                ray.material.opacity = Math.max(0, 0.02 - depthNorm * 0.02);
            });

            // Update underwater shader
            underwaterPass.uniforms.time.value = time * 0.001;
            underwaterPass.uniforms.depth.value = depthNorm;

            // Bloom intensifies with depth
            bloomPass.strength = 1.0 + depthNorm * 1.5;

            // Zone change notification
            if (zone.name !== currentZone) {
                currentZone = zone.name;
                const zoneEl = document.getElementById('zone-name');
                zoneEl.textContent = zone.name;
                zoneEl.style.opacity = '1';
                setTimeout(() => { zoneEl.style.opacity = '0'; }, 3000);
            }

            // === PARTICLES ===
            particleLayers.forEach(layer => {
                const pos = layer.geometry.attributes.position.array;
                for (let i = 0; i < pos.length; i += 3) {
                    pos[i + 1] -= layer.userData.speed;
                    pos[i] += Math.sin(time * 0.00005 + i) * 0.003;
                    if (pos[i + 1] < -100) pos[i + 1] = 20;
                }
                layer.geometry.attributes.position.needsUpdate = true;
            });

            // Plankton twinkle
            const pPos = plankton.geometry.attributes.position.array;
            for (let i = 0; i < planktonCount * 3; i += 3) {
                pPos[i] += Math.sin(time * 0.0003 + i * 0.5) * 0.005;
                pPos[i + 1] += Math.cos(time * 0.0002 + i * 0.3) * 0.003;
            }
            plankton.geometry.attributes.position.needsUpdate = true;

            // Kelp animation
            scene.children.forEach(child => {
                if (child.userData && child.userData.type === 'kelp') {
                    child.children.forEach(seg => {
                        if (seg.userData && seg.userData.segIndex !== undefined) {
                            const intensity = seg.userData.segIndex * 0.08;
                            seg.rotation.x = Math.sin(time * 0.0008 + seg.userData.phase + seg.userData.segIndex * 0.3) * intensity;
                            seg.rotation.z = Math.cos(time * 0.0006 + seg.userData.phase) * intensity * 0.5;
                        }
                    });
                }
                // Vent smoke
                if (child.userData && child.userData.type === 'vent') {
                    const sp = child.userData.smoke.geometry.attributes.position.array;
                    for (let i = 0; i < sp.length; i += 3) {
                        sp[i + 1] += 0.05 + Math.random() * 0.02;
                        sp[i] += (Math.random() - 0.5) * 0.08;
                        sp[i + 2] += (Math.random() - 0.5) * 0.08;
                        if (sp[i + 1] > 30) {
                            sp[i] = (Math.random() - 0.5) * 2;
                            sp[i + 1] = 10;
                            sp[i + 2] = (Math.random() - 0.5) * 2;
                        }
                    }
                    child.userData.smoke.geometry.attributes.position.needsUpdate = true;
                }
                // Bubble columns
                if (child.userData && child.userData.type === 'bubbleColumn') {
                    const bp = child.geometry.attributes.position.array;
                    const speeds = child.userData.speeds;
                    for (let i = 0; i < speeds.length; i++) {
                        bp[i * 3 + 1] += speeds[i];
                        bp[i * 3] += Math.sin(time * 0.001 + i) * 0.01;
                        if (bp[i * 3 + 1] > -60) {
                            bp[i * 3] = child.userData.baseX + (Math.random() - 0.5) * 3;
                            bp[i * 3 + 1] = -98;
                            bp[i * 3 + 2] = child.userData.baseZ + (Math.random() - 0.5) * 3;
                        }
                    }
                    child.geometry.attributes.position.needsUpdate = true;
                }
            });

            // Animate creatures
            animateCreatures(time);

            // Creature proximity check
            if (time - lastCreatureCheck > 300) {
                checkCreatureProximity();
                lastCreatureCheck = time;
            }

            // === HUD UPDATE ===
            document.getElementById('depth-val').textContent = Math.round(depth) + ' m';
            document.getElementById('speed-val').textContent = (Math.abs(subState.speed) * 50).toFixed(1) + ' kn';
            document.getElementById('heading-val').textContent =
                (((submarine.rotation.y * 180 / Math.PI) % 360 + 360) % 360).toFixed(0).padStart(3, '0') + '°';
            document.getElementById('zone-val').textContent = zone.name;
            document.getElementById('creatures-val').textContent =
                creaturesSpotted.size + ' / ' + Object.keys(creatureDatabase).length;

            const depthPercent = Math.min(100, (depth / 95) * 100);
            document.getElementById('depth-gauge-fill').style.height = depthPercent + '%';
            const markerTop = 50 - (depthPercent - 50) * 1.0;
            document.getElementById('depth-marker').style.top = markerTop + '%';
            document.getElementById('depth-marker').textContent = Math.round(depth) + 'm';

            // Render
            composer.render();
        }

        // === START ===
        setTimeout(() => {
            const loadEl = document.getElementById('loading');
            loadEl.style.opacity = '0';
            setTimeout(() => {
                loadEl.style.display = 'none';
            }, 2000);
            animate();
        }, 3000);

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
